<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#087f5b"><title>甜蜜果物｜語音進貨</title><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f2;color:#19362b;font-family:system-ui,-apple-system,sans-serif}header{background:#087f5b;color:white;padding:20px}header>div,main{max-width:1100px;margin:auto}h1{margin:0;font-size:25px}header p{margin:5px 0 0;opacity:.9}main{padding:18px}.card{background:white;border:1px solid #dcebe0;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #1948320b}.top,.row,.actions,.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between}.stats>div{flex:1;min-width:150px;background:#edf8f1;border-radius:14px;padding:14px}.stats strong{display:block;font-size:25px;margin-top:4px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#e7f2ea;color:#164831;font-weight:700;min-height:46px}button.primary{background:#087f5b;color:white}button.mic{font-size:21px;min-height:70px;padding:15px 28px}button.danger{background:#fff0ed;color:#a42a22}.hint{color:#637b6b;font-size:14px;line-height:1.6}input,select,textarea{border:1px solid #b9cec0;border-radius:10px;padding:11px;min-width:0;background:white}input[type=date]{min-height:46px}textarea{width:100%}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e7eee8}th{color:#60796b;font-size:14px}td button{white-space:nowrap;padding:8px 10px}.green{background:#dff4e8;color:#08623b}.red{background:#fff0eb;color:#a03724}.yellow{background:#fff3d7;color:#865600}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fields label{display:grid;gap:5px;font-size:14px}.fields input,.fields select{width:100%}dialog{border:0;border-radius:18px;width:min(94vw,620px);padding:22px;box-shadow:0 10px 50px #0004}dialog::backdrop{background:#102a1aaa}#notice{padding:12px;background:#e9f7ee;border-radius:12px;margin-top:12px;display:none}.hideprint{display:block}#printReport{display:none}@media(max-width:650px){.fields{grid-template-columns:repeat(2,1fr)}main{padding:10px}.card{padding:14px}}@media print{header,main,dialog{display:none!important}#printReport{display:block;color:#000}table{min-width:0;font-size:11px}button{display:none}@page{size:A4 landscape;margin:10mm}}
</style></head><body><header><div><h1>🍐 甜蜜果物・語音進貨</h1><p>快速記錄報價，掌握付款與上車狀態</p></div></header><main>
<div class="card"><div class="top"><div><b>雲端同步</b> <span id="cloudStatus">本機模式</span><div class="hint">同一網站、同一組 Firebase 設定的裝置可同步。</div></div><button onclick="cloudDialog.showModal()">⚙️ 雲端設定</button></div></div>
<div class="card"><h2>🎙️ 說一筆進貨</h2><div class="row"><button class="primary mic" id="mic" onclick="startVoice()">🎙️ 點我說話</button><button onclick="openEdit()">＋ 手動新增</button></div><p class="hint">例如：帝王芭樂一千元三件、24蘋果1900三件。一次說一筆；件＝箱。<br>辨識不完整時不會自動新增，請檢查後手動補上。</p><div id="voiceText" aria-live="polite"></div><div id="notice"></div></div>
<div class="card"><div class="top"><h2>📅 進貨紀錄</h2><div class="row"><input id="date" type="date" onchange="render()"><button onclick="todayView()">回到今天</button></div></div><div class="stats"><div>已付款金額<strong id="paid">$0</strong></div><div>未付款金額<strong id="unpaid">$0</strong></div><div>未上車件數<strong id="unloaded">0 件</strong></div></div><p class="hint">以下統計依選取日期計算。點擊狀態即可切換。</p><div class="scroll"><table><thead><tr><th>品名／進貨商</th><th>單價</th><th>件數</th><th>小計</th><th>上車狀態</th><th>付款狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions" style="margin-top:16px"><button onclick="printReport()">🖨️ 列印／儲存 PDF</button><button onclick="exportExcel()">📊 匯出 Excel</button></div></div></main>
<dialog id="editDialog"><h2 id="editTitle">新增進貨</h2><form id="form"><input type="hidden" id="editId"><div class="fields"><label>品名<input id="name" required placeholder="例如 24蘋果"></label><label>進貨商（選填）<input id="supplier"></label><label>每件單價<input id="price" type="number" min="0" step="any" required></label><label>件數<input id="qty" type="number" min="0.01" step="any" required></label><label>付款狀態<select id="payment"><option value="paid">已付款</option><option value="unpaid">未付款</option></select></label><label>上車狀態<select id="status"><option value="unloaded">未上車</option><option value="loaded">已上車</option></select></label></div><p class="hint">件與箱為同一單位。</p><div class="actions"><button type="submit" class="primary">儲存</button><button type="button" onclick="editDialog.close()">取消</button></div></form></dialog>
<dialog id="cloudDialog"><h2>雲端即時同步設定</h2><p class="hint">貼上原本使用的 Firebase 設定 JSON。第一版使用獨立的資料區，避免影響舊工具。</p><textarea id="config" rows="9" placeholder='{"apiKey":"...", "databaseURL":"...", "projectId":"..."}'></textarea><div class="actions"><button class="primary" onclick="saveConfig()">儲存並連線</button><button onclick="cloudDialog.close()">取消</button></div></dialog><div id="printReport"></div>
<script>
const $=id=>document.getElementById(id), key='fruit_voice_v1_records', configKey='fruit_cloud_config';let records={}, db=null, connected=false, initialized=false, latestId=null, selectedDay='';const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function localSave(){localStorage.setItem(key,JSON.stringify(records))}try{records=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){records={}}$('date').value=today();selectedDay=$('date').value;$('config').value=localStorage.getItem(configKey)||'';
function initCloud(){let text=localStorage.getItem(configKey);if(!text)return;try{if(!window.firebase)throw Error('Firebase 載入失敗');let cfg=JSON.parse(text);if(!cfg.databaseURL)throw Error('缺少 databaseURL');let app=firebase.apps.find(x=>x.name==='fruitVoice')||firebase.initializeApp(cfg,'fruitVoice');db=app.database().ref('fruitVoiceInventoryV1');app.database().ref('.info/connected').on('value',s=>{connected=!!s.val();$('cloudStatus').textContent=connected?(initialized?'🟢 已連線':'🟡 連線中'):'🟠 離線／等待連線'});db.on('value',snap=>{records=snap.val()||{};initialized=true;localSave();render();$('cloudStatus').textContent=connected?'🟢 已連線':'🟠 離線／等待連線'},err=>{$('cloudStatus').textContent='🔴 讀取失敗';alert('雲端讀取失敗：'+err.message)})}catch(e){$('cloudStatus').textContent='🔴 設定或連線錯誤';console.error(e)}}function saveConfig(){try{let c=JSON.parse($('config').value);if(!c.databaseURL)throw Error('缺少 databaseURL');localStorage.setItem(configKey,JSON.stringify(c));cloudDialog.close();location.reload()}catch(e){alert('設定格式錯誤：'+e.message)}}function saveRecord(item){if(db&&!initialized){alert('正在讀取雲端資料，請稍後再試。');return false}records[item.id]=item;localSave();render();if(db)db.child(item.id).set(item).catch(e=>alert('雲端儲存失敗，請檢查連線：'+e.message));return true}function remove(id){if(!confirm('確定刪除這筆進貨？'))return;if(db&&!initialized)return alert('雲端尚未完成讀取');delete records[id];localSave();render();if(db)db.child(id).remove().catch(e=>alert('刪除同步失敗：'+e.message))}function toggle(id,field){let x=records[id];if(!x)return;x={...x,[field]:field==='payment'?(x.payment==='paid'?'unpaid':'paid'):(x.status==='loaded'?'unloaded':'loaded')};saveRecord(x)}function list(){return Object.values(records).filter(x=>x&&x.date===$('date').value).sort((a,b)=>(b.created||0)-(a.created||0))}function render(){if(selectedDay!==$('date').value){selectedDay=$('date').value;latestId=null;$('notice').style.display='none'}let a=list(),p=0,u=0,b=0;for(let x of a){let t=Number(x.price)*Number(x.qty);if(x.payment==='paid')p+=t;else u+=t;if(x.status!=='loaded')b+=Number(x.qty)}$('paid').textContent=money(p);$('unpaid').textContent=money(u);$('unloaded').textContent=b+' 件';$('rows').innerHTML=a.length?a.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.supplier||'未填進貨商')}</small></td><td>${money(x.price)}</td><td>${esc(x.qty)} 件</td><td><b>${money(x.price*x.qty)}</b></td><td><button class="${x.status==='loaded'?'green':'yellow'}" onclick="toggle('${esc(x.id)}','status')">${x.status==='loaded'?'已上車':'未上車'}</button></td><td><button class="${x.payment==='paid'?'green':'red'}" onclick="toggle('${esc(x.id)}','payment')">${x.payment==='paid'?'已付款':'未付款'}</button></td><td><button onclick="openEdit('${esc(x.id)}')">修改</button> <button class="danger" onclick="remove('${esc(x.id)}')">刪除</button></td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:#809286;padding:30px">這一天還沒有進貨紀錄</td></tr>';if(latestId&&records[latestId]){let x=records[latestId];$('notice').style.display='block';$('notice').innerHTML=`剛新增：<b>${esc(x.name)}，${money(x.price)} × ${esc(x.qty)} 件＝${money(x.price*x.qty)}</b>　<button class="${x.payment==='paid'?'green':'red'}" onclick="toggle('${esc(x.id)}','payment')">${x.payment==='paid'?'已付款':'未付款'}（點擊切換）</button> <button onclick="openEdit('${esc(x.id)}')">修改</button>`}}
function todayView(){$('date').value=today();render()}function openEdit(id='',preset={}){let x=records[id]||preset;$('editTitle').textContent=id?'修改進貨':'新增進貨';$('editId').value=id;$('name').value=x.name||'';$('supplier').value=x.supplier||'';$('price').value=x.price??'';$('qty').value=x.qty??'';$('payment').value=x.payment||'paid';$('status').value=x.status||'unloaded';editDialog.showModal()}$('form').onsubmit=e=>{e.preventDefault();let old=records[$('editId').value];let item={id:old?.id||('r'+Date.now()+Math.random().toString(36).slice(2,8)),date:old?.date||$('date').value,created:old?.created||Date.now(),name:$('name').value.trim(),supplier:$('supplier').value.trim(),price:Number($('price').value),qty:Number($('qty').value),payment:$('payment').value,status:$('status').value};if(!item.name||item.qty<=0||item.price<0)return alert('請確認品名、單價與件數');if(saveRecord(item))editDialog.close()};
function chineseNumber(s){s=s.replace(/兩/g,'二').replace(/零/g,'〇');if(/^\d+(\.\d+)?$/.test(s))return Number(s);let map={'〇':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9},unit={'十':10,'百':100,'千':1000,'萬':10000};if(!/^[〇一二三四五六七八九十百千萬\d]+$/.test(s))return NaN;if(!/[十百千萬]/.test(s))return Number([...s].map(c=>map[c]??c).join(''));let total=0,section=0,num=0;for(let c of s){if(c in unit){let v=unit[c];if(v===10000){section=(section+num||1)*v;total+=section;section=0}else section+=(num||1)*v;num=0}else num=map[c]??Number(c)}return total+section+num}function parseVoice(raw){let text=raw.replace(/\s/g,'').replace(/[，。,.、]/g,'');let n='[0-9〇零一二兩三四五六七八九十百千萬]+';let re=new RegExp('^(.*?)('+n+')(?:元|塊錢|塊)?('+n+')(?:件|箱)$');let m=text.match(re);if(!m)return null;let price=chineseNumber(m[2]),qty=chineseNumber(m[3]);if(!m[1]||!Number.isFinite(price)||price<=0||!Number.isFinite(qty)||qty<=0)return null;return {name:m[1],price,qty}}function startVoice(){if($('date').value!==today()&&!confirm('目前選擇的不是今天，這筆將記在 '+$('date').value+'，確定繼續？'))return;let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('voiceText').textContent='此瀏覽器目前無法啟用語音辨識，請使用手動新增，或以 Safari／Chrome 開啟網頁測試。';return}let r=new SR();r.lang='zh-TW';r.interimResults=false;r.maxAlternatives=1;$('mic').disabled=true;$('voiceText').textContent='🎙️ 正在聆聽，請說一筆進貨…';r.onresult=e=>{let raw=e.results[0][0].transcript;$('voiceText').textContent='辨識到：'+raw;let p=parseVoice(raw);if(!p){$('voiceText').textContent+='。無法完整辨識，請手動補上資料。';openEdit('',{});return}let x={...p,id:'r'+Date.now()+Math.random().toString(36).slice(2,8),date:$('date').value,created:Date.now(),supplier:'',payment:'paid',status:'unloaded'};latestId=x.id;saveRecord(x)};r.onerror=e=>{$('voiceText').textContent='語音辨識未完成（'+e.error+'），請檢查麥克風權限或改用手動新增。'};r.onend=()=>{$('mic').disabled=false};try{r.start()}catch(e){$('mic').disabled=false;$('voiceText').textContent='無法啟動麥克風：'+e.message}}
function reportData(){return list().map(x=>({品名:x.name,進貨商:x.supplier||'',單價:Number(x.price),件數:Number(x.qty),小計:Number(x.price)*Number(x.qty),上車狀態:x.status==='loaded'?'已上車':'未上車',付款狀態:x.payment==='paid'?'已付款':'未付款'}))}function exportExcel(){if(!window.XLSX)return alert('Excel 元件未載入，請確認網路後重試。');let a=reportData();if(!a.length)return alert('所選日期沒有資料');let ws=XLSX.utils.json_to_sheet(a);ws['!cols']=[{wch:22},{wch:16},{wch:12},{wch:10},{wch:14},{wch:12},{wch:12}];let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'進貨明細');XLSX.writeFile(wb,$('date').value+'進貨明細.xlsx')}function printReport(){let a=reportData();if(!a.length)return alert('所選日期沒有資料');$('printReport').innerHTML=`<h2>甜蜜果物 進貨明細 ${esc($('date').value)}</h2><p>已付款 ${$('paid').textContent}　未付款 ${$('unpaid').textContent}　未上車 ${$('unloaded').textContent}</p><table><thead><tr>${Object.keys(a[0]).map(k=>'<th>'+esc(k)+'</th>').join('')}</tr></thead><tbody>${a.map(x=>'<tr>'+Object.values(x).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')}</tbody></table>`;window.print()}initCloud();render();
</script></body></html>
