<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水果成本與售價計算</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><style>
:root{font-family:system-ui,-apple-system,'Microsoft JhengHei',sans-serif;color:#243c32;background:#f4f6ef}*{box-sizing:border-box}body{margin:0}header{background:#244b39;color:white;padding:20px max(24px,calc((100vw - 1200px)/2)) 30px}.top{display:flex;align-items:center;gap:12px}.top button{background:transparent;color:white;border:1px solid #a6c4b0}h1{font-size:30px;margin:27px 0 5px}header p{margin:0;color:#c5dace}main{max-width:1200px;margin:0 auto;padding:22px 24px}button,.file{border:1px solid #d6e0d6;background:#fff;color:#244b39;border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer;font-weight:650}button:hover,.file:hover{background:#edf5ee}.primary,.file{background:#367a50;color:white;border-color:#367a50}.primary:hover,.file:hover{background:#2d6943}input,select{font:inherit;border:1px solid #cbd8cd;border-radius:8px;padding:10px;width:100%;background:white;color:#263a2e}.toolbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:white;border:1px solid #e0e9dd;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #34553609}.toolbar .date{width:170px}.grow{flex:1}.status{font-size:13px;color:#627569}.summary{display:flex;gap:30px;flex-wrap:wrap}.stat strong{display:block;font-size:24px;margin-top:4px}.stat span,.muted{font-size:13px;color:#738579}.item{border:1px solid #dce8dc;border-radius:10px;margin:10px 0;overflow:hidden}.item-head{display:flex;align-items:center;gap:14px;padding:15px;background:#fbfcf9;cursor:pointer}.item-head strong{font-size:16px}.badge{font-size:12px;color:#936b25;background:#fff5d9;padding:4px 8px;border-radius:6px}.body{padding:18px;border-top:1px solid #e7eee5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid label{font-size:13px;color:#536b5a;display:block}.grid input{margin-top:6px}.results{margin-top:16px;background:#edf6ec;border-radius:10px;padding:15px;display:flex;gap:45px;flex-wrap:wrap}.results strong{display:block;font-size:22px;color:#226a42;margin-top:4px}.error{color:#a03c31;font-size:13px}.danger{color:#a13d35}.empty{text-align:center;padding:50px;color:#849486}.notice{padding:10px;background:#fff5df;color:#785b22;border-radius:8px;margin:10px 0;font-size:13px}.small{font-size:12px} @media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}header h1{font-size:25px}.item-head{flex-wrap:wrap}.item-head .grow{display:none}main{padding:15px}.summary{gap:18px}}@media print{header,.toolbar,button,.file,.body,.status,.notice,.no-print{display:none!important}main{max-width:none}.panel{border:0;box-shadow:none}.item{break-inside:avoid}.print-details{display:block!important}.item-head{padding:8px}}
</style></head><body><header><div class="top"><button id="home">← 回首頁</button><button id="sethome">設定首頁網址</button></div><h1>水果成本與售價計算</h1><p>匯入進貨明細，掌握每個品項的成本與建議售價</p></header><main><section class="panel"><div class="toolbar"><label>紀錄日期 <input class="date" type="date" id="day"></label><label class="file">＋ 匯入進貨明細<input type="file" id="import" accept=".xlsx,.xls,.csv" hidden></label><button id="add">＋ 手動新增</button><div class="grow"></div><span id="status" class="status">正在連線雲端…</span></div><div class="notice" id="warning" hidden></div></section><section class="panel"><div class="summary"><div class="stat"><span>當日品項</span><strong id="count">0</strong></div><div class="stat"><span>已完成計算</span><strong id="done">0</strong></div><div class="stat"><span>等待填寫</span><strong id="pending">0</strong></div></div></section><section class="panel"><div class="toolbar"><div><strong>品項明細</strong><div class="muted">點擊品項展開編輯，計算結果以單件為基準</div></div><div class="grow"></div><button id="copy">複製摘要</button><button id="export">匯出 Excel</button><button id="pdf">列印 / 存成 PDF</button></div><div id="list"></div></section></main><script>
const cfg={apiKey:'AIzaSyC--ACJtcLYPDukAiUFb5Ew1KLacynti7g',authDomain:'fir-config-276df.firebaseapp.com',projectId:'fir-config-276df',databaseURL:'https://fir-config-276df-default-rtdb.asia-southeast1.firebasedatabase.app'};let db=null,ref=null,items={},presets={},opened=new Set(),ready=false;const $=id=>document.getElementById(id);const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('day').value=today();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);const num=x=>x!==''&&x!=null&&Number.isFinite(Number(x))?Number(x):null;const money=n=>Number(n).toFixed(2);function calc(x){let p=num(x.price),q=num(x.amount),loss=num(x.loss),m=num(x.markup);if(p===null||p<0||q===null||q<=0||loss===null||loss<0||loss>=q||m===null||m<0)return null;let cost=p/(q-loss);return {cost,sale:cost*(1+m/100)}}function rows(){return Object.entries(items).map(([id,x])=>({id,...x})).sort((a,b)=>(a.created||0)-(b.created||0))}function warn(t){$('warning').hidden=!t;$('warning').textContent=t}function listen(){if(ref)ref.off();items={};opened.clear();ready=false;render();if(!db)return;ref=db.ref('fruit_cost_tool_v1/days/'+$('day').value);$('status').textContent='正在讀取雲端…';ref.on('value',snap=>{items=snap.val()||{};ready=true;$('status').textContent='☁ 雲端已連線';warn('');render()},err=>{$('status').textContent='雲端讀取失敗';warn('無法讀取雲端資料，請檢查 Firebase 資料庫規則或網路連線。為避免覆蓋資料，目前無法編輯。 '+err.message)});}function persist(id,x){if(!ready){alert('雲端資料尚未讀取完成，請檢查連線。');return}ref.child(id).set(x).catch(e=>{warn('儲存失敗，修改可能尚未同步：'+e.message)})}function savePreset(x){if(!x.name||!calc(x))return;db.ref('fruit_cost_tool_v1/presets/'+encodeURIComponent(x.name).replace(/\./g,'%2E')).set({amount:x.amount,loss:x.loss,unit:x.unit,markup:x.markup}).catch(e=>warn('上次設定儲存失敗：'+e.message))}function render(){let a=rows(),complete=a.filter(calc).length;$('count').textContent=a.length;$('done').textContent=complete;$('pending').textContent=a.length-complete;$('list').innerHTML=a.length?a.map(x=>{let c=calc(x),open=opened.has(x.id);return `<div class="item"><div class="item-head" data-toggle="${x.id}"><strong>${esc(x.name||'未命名品項')}</strong>${x.carried?'<span class="badge">已帶入上次設定，請確認</span>':''}<span class="muted">進價 ${esc(x.price)} 元／${esc(x.buyUnit||'件')}</span><span class="grow"></span><span>${c?'建議 '+money(c.sale)+' 元／'+esc(x.unit||'單位'):'尚未完成計算'}</span><span>${open?'▴':'▾'}</span></div><div class="print-details" style="display:none">${c?'成本 '+money(c.cost)+' 元／'+esc(x.unit)+'　建議售價 '+money(c.sale)+' 元／'+esc(x.unit):'尚未完成計算'}</div>${open?`<div class="body"><div class="grid"><label>品名<input data-id="${x.id}" data-field="name" value="${esc(x.name)}"></label><label>單件進價（元）<input type="number" min="0" step="any" data-id="${x.id}" data-field="price" value="${esc(x.price)}"></label><label>進貨單位<input data-id="${x.id}" data-field="buyUnit" value="${esc(x.buyUnit)}"></label><label>銷售單位（顆、台斤、串、包等）<input data-id="${x.id}" data-field="unit" value="${esc(x.unit)}" placeholder="例如：顆"></label><label>每件總數量／重量<input type="number" min="0" step="any" data-id="${x.id}" data-field="amount" value="${esc(x.amount)}" placeholder="例如 64"></label><label>每件預估損耗<input type="number" min="0" step="any" data-id="${x.id}" data-field="loss" value="${esc(x.loss)}"></label><label>成本加價（%）<input type="number" min="0" step="any" data-id="${x.id}" data-field="markup" value="${esc(x.markup)}"></label></div><div class="results">${c?`<div><span class="muted">單位成本</span><strong>${money(c.cost)} 元／${esc(x.unit||'單位')}</strong></div><div><span class="muted">建議售價（成本加價 ${esc(x.markup)}%）</span><strong>${money(c.sale)} 元／${esc(x.unit||'單位')}</strong></div>`:'<span class="error">請填入進價、總數量、損耗及加價比例；損耗須小於總數量。</span>'}</div><div class="row" style="margin-top:14px"><span class="muted">進貨 ${esc(x.qty??'')} ${esc(x.buyUnit||'件')}　每件計算，不乘進貨數量</span><div class="grow"></div>${x.carried?`<button data-confirm="${x.id}">確認上次設定</button>`:''}<button class="danger" data-delete="${x.id}">刪除品項</button></div></div>`:''}</div>`}).join(''):'<div class="empty">這一天還沒有品項，匯入 Excel 或手動新增開始計算。</div>'}document.addEventListener('click',e=>{let t=e.target.closest('[data-toggle],[data-delete],[data-confirm]');if(!t)return;let id=t.dataset.toggle||t.dataset.delete||t.dataset.confirm;if(t.dataset.toggle){opened.has(id)?opened.delete(id):opened.add(id);render()}else if(t.dataset.delete){if(confirm('確定刪除這筆品項？'))ref.child(id).remove().catch(e=>warn('刪除失敗：'+e.message))}else{let x={...items[id],carried:false};persist(id,x);savePreset(x)}});document.addEventListener('change',e=>{let id=e.target.dataset.id;if(!id||!items[id])return;let x={...items[id],[e.target.dataset.field]:e.target.value};persist(id,x);if(!x.carried)savePreset(x)});$('day').onchange=listen;$('home').onclick=()=>{let u=localStorage.getItem('fruitCostHome');if(u)location.href=u;else alert('請先點選「設定首頁網址」輸入你的首頁網址。')};$('sethome').onclick=()=>{let u=prompt('請輸入首頁完整網址（https:// 開頭）：',localStorage.getItem('fruitCostHome')||'');if(u===null)return;try{let v=new URL(u);if(!['https:','http:'].includes(v.protocol))throw 0;localStorage.setItem('fruitCostHome',v.href);alert('首頁網址已設定於此裝置。')}catch{alert('請輸入有效的完整網址。')}};
function create(name,price,qty,buyUnit,extra={}){let p=presets[encodeURIComponent(name).replace(/\./g,'%2E')];return {name:String(name||''),price:String(price??''),qty:String(qty??1),buyUnit:String(buyUnit||'件'),unit:p?.unit||'',amount:p?.amount??'',loss:p?.loss??'0',markup:p?.markup??'30',carried:!!p,created:Date.now()+Math.random(),...extra}}$('add').onclick=()=>{if(!ready)return alert('請先確認雲端已連線');let id=uid();opened.add(id);persist(id,create('', '',1,'件'))};function signature(x){return [x.name,x.price,x.qty,x.buyUnit,x.supplier||''].map(v=>String(v??'').trim()).join('|')}$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(!ready)throw Error('雲端資料尚未讀取完成');if(!window.XLSX)throw Error('Excel 讀取元件載入失敗，請檢查網路');let book=XLSX.read(await f.arrayBuffer(),{type:'array'}),data=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:''});if(!data.length||!('品名'in data[0])||!('單價'in data[0]))throw Error('找不到「品名」或「單價」欄位，請確認檔案格式');let incoming=data.filter(r=>String(r['品名']).trim()).map(r=>create(r['品名'],r['單價'],r['數量'],r['單位'],{supplier:String(r['進貨商']||'')}));let known=new Set(rows().map(signature)),dups=incoming.filter(x=>known.has(signature(x))).length;if(dups&&!confirm(`發現 ${dups} 筆與當天清單內容相同（品名、單價、數量、單位、進貨商）的資料。仍要全部匯入嗎？`))return;if(!incoming.length)throw Error('檔案沒有可匯入的品項');let updates={};for(let x of incoming)updates[uid()]=x;await ref.update(updates);alert(`已匯入 ${incoming.length} 筆品項。`)}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}};$('copy').onclick=async()=>{let t=$('day').value+' 水果成本與建議售價\n'+rows().map(x=>{let c=calc(x);return `${x.name}｜${c?`成本 ${money(c.cost)} 元／${x.unit||'單位'}｜建議售價 ${money(c.sale)} 元／${x.unit||'單位'}`:'尚未完成計算'}`}).join('\n');try{await navigator.clipboard.writeText(t);alert('已複製摘要')}catch{prompt('請複製下方摘要：',t)}};$('export').onclick=()=>{if(!window.XLSX)return alert('Excel 元件載入失敗');let data=rows().map(x=>{let c=calc(x);return {'品名':x.name,'單件進價':num(x.price),'進貨數量':num(x.qty),'進貨單位':x.buyUnit,'每件總數量':num(x.amount),'每件損耗':num(x.loss),'銷售單位':x.unit,'成本加價%':num(x.markup),'單位成本':c?c.cost:null,'建議售價':c?c.sale:null,'狀態':x.carried?'請確認上次設定':c?'已計算':'未完成'}});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'成本與售價');XLSX.writeFile(wb,$('day').value+'水果成本與售價.xlsx')};$('pdf').onclick=()=>window.print();try{firebase.initializeApp(cfg);db=firebase.database();db.ref('fruit_cost_tool_v1/presets').on('value',s=>presets=s.val()||{},e=>warn('無法讀取上次設定：'+e.message));listen()}catch(e){$('status').textContent='雲端元件載入失敗';warn('請檢查網路連線，重新整理頁面。'+e.message)}
</script></body></html>
