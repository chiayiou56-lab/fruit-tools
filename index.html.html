<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果店老闆專屬工具箱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 sm:p-6 text-gray-800">

    <div class="max-w-md mx-auto space-y-6 mt-6">
        
        <!-- 頂部標題 -->
        <div class="text-center space-y-2">
            <div class="inline-block bg-emerald-100 text-emerald-800 p-3 rounded-full text-2xl shadow-sm">
                <i class="fa-solid fa-apple-whole"></i>
            </div>
            <h1 class="text-2xl font-black text-gray-800">水果店專屬工具箱</h1>
            <p class="text-xs text-gray-500">點擊下方按鈕切換不同作業工具</p>
        </div>

        <!-- 工具按單列表 -->
        <div class="space-y-4">
            
            <!-- 工具 1 -->
            <a href="tool1.html" class="block bg-white p-5 rounded-xl shadow-md hover:shadow-lg border-l-8 border-emerald-500 transition transform hover:-translate-y-0.5">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                            <i class="fa-solid fa-truck-ramp-box text-emerald-600"></i> 進貨用小工具
                        </h2>
                        <p class="text-xs text-gray-500 mt-1">處理每日進貨品項、規格與上車明細</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400"></i>
                </div>
            </a>

            <!-- 工具 2 -->
            <a href="tool2.html" class="block bg-white p-5 rounded-xl shadow-md hover:shadow-lg border-l-8 border-blue-500 transition transform hover:-translate-y-0.5">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="font-bold text-lg text-gray-800 flex items-center gap-2">
                            <i class="fa-solid fa-calculator text-blue-600"></i> 水果售價計算
                        </h2>
                        <p class="text-xs text-gray-500 mt-1">計算損耗、單位成本與建議售價及 PDF 摘要</p>
                    </div>
                    <i class="fa-solid fa-chevron-right text-gray-400"></i>
                </div>
            </a>

        </div>

        <!-- 底部小字 -->
        <div class="text-center text-xs text-gray-400 pt-8">
            <p>💡 建議將此首頁加入手機主畫面，隨時隨地開啟！</p>
        </div>

    </div>

</body>
</html>
