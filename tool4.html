<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>甜蜜果物 - 包裝材料盤點與叫貨管理系統</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Firebase App & Realtime Database SDK (v8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- html2canvas & jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
    }
    [x-cloak] { display: none !important; }

    /* 優化表單元素外觀 */
    input, select, textarea, button {
      -webkit-appearance: none;
      border-radius: 0.75rem;
    }

    input[type="text"], input[type="number"], select, textarea {
      font-size: 16px !important; /* 防止 iOS Safari 自動放大 */
    }

    @media (min-width: 640px) {
      input[type="text"], input[type="number"], select, textarea {
        font-size: 14px !important;
      }
    }

    /* 隱藏數字輸入框的上下箭頭 */
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none; margin: 0; 
    }

    /* 確保觸控範圍足夠大 */
    .touch-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .touch-btn:active {
      transform: scale(0.95);
    }
    
    /* 自訂捲軸 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

<body class="text-slate-800 min-h-screen flex flex-col antialiased pb-20 sm:pb-12" x-data="packagingApp()" x-init="init()" x-cloak>

  <!-- TOP HEADER -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between py-3 gap-3">
        
        <!-- App Title & Cloud Status -->
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-teal-500 to-cyan-600 text-white flex items-center justify-center shadow-lg shadow-teal-500/30 shrink-0">
            <i class="fa-solid fa-boxes-packing text-2xl"></i>
          </div>
          <div>
            <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight">
              甜蜜果物<span class="text-teal-600">包材系統</span>
            </h1>
            <div class="flex items-center mt-0.5 gap-2">
              <button @click="showCloudModal = true" class="text-[11px] px-2.5 py-0.5 rounded-full font-bold flex items-center gap-1.5 transition-colors cursor-pointer"
                    :class="isCloudConnected ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'">
                <i class="fa-solid" :class="isCloudConnected ? 'fa-cloud' : 'fa-cloud-slash'"></i>
                <span x-text="isCloudConnected ? '雲端同步中' : '本機模式 (點擊設定)'"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex items-center bg-slate-100 p-1.5 rounded-2xl shadow-inner overflow-x-auto">
          <button @click="currentTab = 'inventory'" :class="currentTab === 'inventory' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="touch-btn px-4 py-2 rounded-xl text-sm font-bold flex gap-2 whitespace-nowrap">
            <i class="fa-solid fa-box-archive mt-0.5"></i> 庫存總覽
          </button>
          <button @click="currentTab = 'favorites'" :class="currentTab === 'favorites' ? 'bg-amber-400 text-amber-950 shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="touch-btn px-4 py-2 rounded-xl text-sm font-bold flex gap-2 whitespace-nowrap">
            <i class="fa-solid fa-star mt-0.5" :class="currentTab === 'favorites' ? '' : 'text-amber-400'"></i> 常叫貨
            <span x-show="getFavoriteItems().length > 0" x-text="getFavoriteItems().length" class="bg-black/10 px-1.5 py-0.5 rounded-md text-[10px]"></span>
          </button>
          <button @click="currentTab = 'order'" :class="currentTab === 'order' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'" class="touch-btn px-4 py-2 rounded-xl text-sm font-bold flex gap-2 whitespace-nowrap">
            <i class="fa-solid fa-cart-shopping mt-0.5"></i> 採購單
            <span x-show="orderedItems.length > 0" x-text="orderedItems.length" class="bg-teal-100 text-teal-700 px-1.5 py-0.5 rounded-md text-[10px]"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- TOOLBAR (Inventory & Favorites) -->
    <div x-show="currentTab === 'inventory' || currentTab === 'favorites'" x-transition class="bg-white p-4 rounded-3xl shadow-sm border border-slate-200 flex flex-col lg:flex-row gap-4 justify-between items-center">
      
      <!-- Search & Filter -->
      <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" x-model="searchQuery" placeholder="搜尋品名、規格..." class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition text-sm">
        </div>

        <select x-show="currentTab === 'inventory'" x-model="selectedSupplierFilter" class="w-full sm:w-48 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-teal-500 text-sm font-bold text-slate-700 cursor-pointer">
          <option value="all">🏢 所有廠商顯示</option>
          <template x-for="sup in suppliers" :key="'filter-' + sup">
            <option :value="sup" x-text="sup"></option>
          </template>
        </select>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center justify-center gap-2 w-full lg:w-auto">
        <button @click="showBatchModal = true" class="touch-btn bg-teal-600 hover:bg-teal-700 text-white font-bold px-4 py-2.5 rounded-2xl shadow-md shadow-teal-600/20 text-sm flex gap-2">
          <i class="fa-solid fa-plus mt-0.5"></i> 新增品項
        </button>
        <button @click="showSupplierModal = true" class="touch-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold px-4 py-2.5 rounded-2xl shadow-sm text-sm">
          管理廠商
        </button>
        
        <!-- More Actions Dropdown (Responsive) -->
        <div class="relative" x-data="{ open: false }">
          <button @click="open = !open" @click.away="open = false" class="touch-btn bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold px-4 py-2.5 rounded-2xl shadow-sm text-sm">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div x-show="open" x-transition class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-40">
            <button @click="exportData(); open = false" class="w-full text-left px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2">
              <i class="fa-solid fa-file-export text-slate-400 w-4"></i> 匯出備份 (JSON)
            </button>
            <label class="w-full text-left px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-file-import text-slate-400 w-4"></i> 匯入備份
              <input type="file" accept=".json" class="hidden" @change="importData($event); open = false">
            </label>
            <div class="h-px bg-slate-100 my-1"></div>
            <button @click="confirmAction('確定要將所有庫存歸零嗎？', () => clearAllStock()); open = false" class="w-full text-left px-4 py-3 text-sm font-bold text-amber-600 hover:bg-amber-50 flex items-center gap-2">
              <i class="fa-solid fa-rotate-left w-4"></i> 全部庫存歸零
            </button>
            <button @click="confirmAction('警告：這將刪除所有資料，確定清空？', () => clearSystemData()); open = false" class="w-full text-left px-4 py-3 text-sm font-bold text-rose-600 hover:bg-rose-50 flex items-center gap-2">
              <i class="fa-solid fa-trash w-4"></i> 清空系統資料
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB 1: INVENTORY -->
    <div x-show="currentTab === 'inventory'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-8">
      
      <template x-for="supplier in suppliers" :key="supplier">
        <div x-show="(selectedSupplierFilter === 'all' || selectedSupplierFilter === supplier) && (getFilteredItemsBySupplier(supplier).length > 0 || !searchQuery)" 
             class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
          
          <!-- Supplier Header -->
          <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg">
                <i class="fa-solid fa-industry"></i>
              </div>
              <div>
                <h2 class="text-lg font-black text-slate-800 flex items-center gap-2">
                  <span x-text="supplier"></span>
                  <span class="bg-white border border-slate-200 text-slate-500 text-xs px-2 py-1 rounded-lg font-bold" x-text="getFilteredItemsBySupplier(supplier).length + ' 項'"></span>
                </h2>
              </div>
            </div>
          </div>

          <!-- Items Grid -->
          <div class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
            <template x-for="item in getFilteredItemsBySupplier(supplier)" :key="item.id">
              <div class="relative bg-white rounded-2xl border transition-all duration-300 hover:shadow-lg flex flex-col justify-between"
                   :class="item.currentStock <= item.safetyStock ? 'border-rose-300 ring-2 ring-rose-100' : 'border-slate-200'">
                
                <!-- Card Header -->
                <div class="p-4 border-b border-slate-100 flex justify-between items-start gap-2">
                  <div class="flex-1">
                    <h3 class="font-bold text-slate-900 leading-tight" x-text="item.name"></h3>
                    <p class="text-xs text-slate-500 font-medium mt-1" x-text="item.spec || '標準規格'"></p>
                  </div>
                  <div class="flex flex-col gap-2 shrink-0">
                     <button @click="toggleFavorite(item)" class="touch-btn w-9 h-9 rounded-full bg-slate-50 hover:bg-slate-100 text-lg transition">
                        <i class="fa-solid fa-star" :class="item.isFavorite ? 'text-amber-400' : 'text-slate-300'"></i>
                     </button>
                  </div>
                </div>

                <!-- Card Body (Stock Control) -->
                <div class="p-4 bg-slate-50/50 flex-1 flex flex-col gap-4">
                  <div x-show="item.currentStock <= item.safetyStock" class="bg-rose-100 text-rose-700 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation"></i> 庫存過低 (安全值: <span x-text="item.safetyStock"></span>)
                  </div>

                  <div class="flex items-center justify-between gap-3">
                    <button @click="updateStock(item, -1)" class="touch-btn flex-1 h-12 bg-white border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-100 font-black text-xl shadow-sm">-</button>
                    
                    <div class="relative w-20 flex-shrink-0">
                      <input type="number" inputmode="numeric" :value="item.currentStock ?? 0"
                             @input="item.currentStock = $event.target.value === '' ? 0 : Math.max(0, parseInt($event.target.value) || 0); saveInventory()"
                             @blur="if (item.currentStock === '' || isNaN(item.currentStock)) item.currentStock = 0; saveInventory()"
                             class="w-full h-12 text-center text-lg font-black bg-white border-2 border-teal-500 rounded-xl shadow-inner text-slate-900 focus:outline-none">
                      <div class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-teal-500 text-white text-[10px] px-2 rounded-full font-bold shadow-sm" x-text="item.unit"></div>
                    </div>
                    
                    <button @click="updateStock(item, 1)" class="touch-btn flex-1 h-12 bg-white border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-100 font-black text-xl shadow-sm">+</button>
                  </div>
                </div>

                <!-- Card Footer (Actions) -->
                <div class="p-3 border-t border-slate-100 flex items-center justify-between bg-white rounded-b-2xl">
                   <div class="flex gap-1">
                      <button @click="openLightbox(item)" class="touch-btn w-10 h-10 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-teal-600 transition" :title="item.image ? '查看照片' : '無照片'">
                        <i class="fa-solid fa-image" :class="item.image ? 'text-teal-600' : ''"></i>
                      </button>
                      <button @click="openEditModal(item)" class="touch-btn w-10 h-10 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-indigo-600 transition">
                        <i class="fa-solid fa-pen"></i>
                      </button>
                      <button @click="confirmAction('確定刪除此品項？', () => deleteItem(item.id))" class="touch-btn w-10 h-10 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-rose-600 transition">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                   </div>
                   <button @click="addToOrder(item)" class="touch-btn px-4 h-10 rounded-xl text-sm font-bold shadow-sm transition"
                           :class="isItemOrdered(item.id) ? 'bg-amber-400 text-amber-950' : 'bg-slate-800 text-white hover:bg-slate-700'">
                     <span x-text="isItemOrdered(item.id) ? '已加入採購' : '+ 叫貨'"></span>
                   </button>
                </div>
              </div>
            </template>
          </div>
          
        </div>
      </template>

      <!-- Empty State -->
      <div x-show="suppliers.length === 0 || inventory.length === 0" class="text-center py-20 bg-white rounded-3xl border border-slate-200 border-dashed">
         <div class="text-slate-300 mb-4 text-5xl"><i class="fa-solid fa-box-open"></i></div>
         <h3 class="text-lg font-bold text-slate-600">目前沒有任何包材資料</h3>
         <p class="text-slate-400 mt-2 text-sm">點擊上方「新增品項」開始建立您的庫存清單</p>
      </div>
    </div>

    <!-- TAB 2: FAVORITES -->
    <div x-show="currentTab === 'favorites'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-6">
      <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-3xl shadow-sm border border-amber-200 overflow-hidden">
        <div class="px-6 py-5 border-b border-amber-200/60 flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-amber-400 text-amber-950 flex items-center justify-center text-xl shadow-lg shadow-amber-400/30">
            <i class="fa-solid fa-star"></i>
          </div>
          <div>
            <h2 class="text-xl font-black text-amber-950 tracking-tight">常叫貨專區</h2>
            <p class="text-sm font-medium text-amber-800/70">快速存取標記星號的常用包材</p>
          </div>
        </div>
        
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-5">
          <template x-for="item in getFavoriteItems()" :key="'fav-' + item.id">
            <!-- 複用 Inventory 的卡片樣式，稍作顏色調整 -->
            <div class="relative bg-white rounded-2xl border border-amber-100 transition-all duration-300 hover:shadow-lg flex flex-col justify-between">
                <div class="p-4 border-b border-slate-100 flex justify-between items-start gap-2">
                  <div class="flex-1">
                    <div class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full inline-block mb-1" x-text="item.origin"></div>
                    <h3 class="font-bold text-slate-900 leading-tight" x-text="item.name"></h3>
                    <p class="text-xs text-slate-500 font-medium mt-1" x-text="item.spec || '標準規格'"></p>
                  </div>
                  <button @click="toggleFavorite(item)" class="touch-btn w-9 h-9 rounded-full bg-amber-50 text-amber-400 text-lg transition hover:scale-110">
                    <i class="fa-solid fa-star"></i>
                  </button>
                </div>
                <div class="p-4 bg-slate-50/50 flex-1 flex items-center justify-between gap-3">
                  <button @click="updateStock(item, -1)" class="touch-btn flex-1 h-12 bg-white border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-100 font-black text-xl shadow-sm">-</button>
                  <div class="relative w-20 flex-shrink-0">
                    <input type="number" :value="item.currentStock ?? 0" @input="item.currentStock = Math.max(0, parseInt($event.target.value) || 0); saveInventory()" class="w-full h-12 text-center text-lg font-black bg-white border-2 border-amber-400 rounded-xl shadow-inner text-slate-900 focus:outline-none">
                    <div class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-amber-400 text-amber-950 text-[10px] px-2 rounded-full font-bold shadow-sm" x-text="item.unit"></div>
                  </div>
                  <button @click="updateStock(item, 1)" class="touch-btn flex-1 h-12 bg-white border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-100 font-black text-xl shadow-sm">+</button>
                </div>
                <div class="p-3 border-t border-slate-100 flex items-center justify-between bg-white rounded-b-2xl">
                   <button @click="addToOrder(item)" class="touch-btn w-full h-10 rounded-xl text-sm font-bold shadow-sm transition"
                           :class="isItemOrdered(item.id) ? 'bg-amber-100 text-amber-800' : 'bg-teal-600 text-white hover:bg-teal-700'">
                     <span x-text="isItemOrdered(item.id) ? '✓ 已加入採購' : '+ 加入採購單'"></span>
                   </button>
                </div>
            </div>
          </template>
        </div>

        <div x-show="getFavoriteItems().length === 0" class="p-12 text-center text-amber-800/50">
          <i class="fa-regular fa-star text-4xl mb-3"></i>
          <p class="font-bold">尚未標記任何常叫貨品項</p>
        </div>
      </div>
    </div>

    <!-- TAB 3: ORDER -->
    <div x-show="currentTab === 'order'" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="space-y-6">
      
      <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-teal-100 text-teal-600 flex items-center justify-center text-xl">
             <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <div>
            <h2 class="text-lg font-black text-slate-900 tracking-tight">採購單管理</h2>
            <p class="text-sm font-medium text-slate-500">已選取 <span class="font-bold text-teal-600" x-text="orderedItems.length"></span> 項待採購包材</p>
          </div>
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <button @click="confirmAction('確定清空叫貨清單嗎？', () => clearOrderList())" x-show="orderedItems.length > 0" class="touch-btn flex-1 sm:flex-none bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-5 py-2.5 rounded-2xl transition">
            清空清單
          </button>
          <button @click="exportToPDF()" x-show="orderedItems.length > 0" class="touch-btn flex-1 sm:flex-none bg-teal-600 hover:bg-teal-700 text-white font-bold px-6 py-2.5 rounded-2xl shadow-md shadow-teal-600/20 transition flex gap-2">
            <i class="fa-solid fa-file-pdf mt-0.5"></i> 匯出 PDF
          </button>
        </div>
      </div>

      <div x-show="orderedItems.length === 0" class="text-center py-20 bg-white rounded-3xl border border-slate-200 border-dashed">
         <div class="text-slate-300 mb-4 text-5xl"><i class="fa-solid fa-cart-arrow-down"></i></div>
         <h3 class="text-lg font-bold text-slate-600">採購單目前是空的</h3>
         <p class="text-slate-400 mt-2 text-sm">請前往「庫存」或「常叫貨」將品項加入清單</p>
      </div>

      <div x-show="orderedItems.length > 0" class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
        
        <!-- Editable List -->
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-500 px-2 uppercase tracking-wider"><i class="fa-solid fa-pen-to-square mr-1"></i> 編輯叫貨內容</h3>

  <!-- APP SCRIPT -->
  <script>
    function packagingApp() {
      return {
        currentTab: 'inventory',
        searchQuery: '',
        selectedSupplierFilter: 'all',
        showBatchModal: false,
        showSupplierModal: false,
        showEditModal: false,
        showCloudModal: false,
        showLightboxModal: false,
        isCloudConnected: false,

        batchSupplier: '',
        batchInputText: '',
        newSupplierName: '',
        lightboxItem: null,
        cloudConfigText: localStorage.getItem('pkg_cloud_config') || '',

        editingItem: { id: null, name: '', spec: '', origin: '', safetyStock: 5, image: '' },
        toast: { show: false, message: '', timeout: null },
        
        // Custom Confirm Dialog State
        confirmDialog: { show: false, message: '', onConfirm: null },

        suppliers: JSON.parse(localStorage.getItem('pkg_suppliers')) || ['必堅', '利泰', '淘寶'],
        inventory: JSON.parse(localStorage.getItem('pkg_inventory')) || [
          { id: 1, name: '瓦楞外箱 5號', spec: '標準規格', origin: '必堅', unit: '箱', currentStock: 12, safetyStock: 5, isFavorite: true, image: '' },
          { id: 2, name: '彩色印刷禮盒', spec: '水果6入裝', origin: '必堅', unit: '個', currentStock: 30, safetyStock: 10, isFavorite: false, image: '' },
          { id: 3, name: '透明封箱膠帶', spec: '48mm x 90y', origin: '利泰', unit: '包', currentStock: 8, safetyStock: 10, isFavorite: true, image: '' }
        ],
        orderedItems: JSON.parse(localStorage.getItem('pkg_ordered_items')) || [],

        init() {
          if(this.suppliers.length > 0) this.batchSupplier = this.suppliers[0];
          this.initFirebase();

          // 手機端喚醒重連
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && this.isCloudConnected && typeof firebase !== 'undefined' && firebase.apps.length) {
              firebase.database().ref('packagingData').once('value').then((snapshot) => {
                const cloudData = snapshot.val();
                if (cloudData) this.syncDataFromCloud(cloudData);
              }).catch(err => console.log('背景重連同步錯誤:', err));
            }
          });
        },

        // --- Firebase (Realtime Database) ---
        initFirebase() {
          if (!this.cloudConfigText.trim() || typeof firebase === 'undefined') return;
          try {
            let config = JSON.parse(this.cloudConfigText);
            if (!firebase.apps.length) {
              firebase.initializeApp(config);
            }
            firebase.database().goOnline();
            const dbRef = firebase.database().ref('packagingData');
            
            dbRef.on('value', (snapshot) => {
              const cloudData = snapshot.val();
              if (cloudData) this.syncDataFromCloud(cloudData);
              this.isCloudConnected = true;
            }, (error) => {
              console.error('Firebase 監聽錯誤:', error);
              this.isCloudConnected = false;
            });
            this.isCloudConnected = true;
          } catch (e) {
            console.error('Firebase 連結失敗:', e);
            this.isCloudConnected = false;
          }
        },

        syncDataFromCloud(cloudData) {
          if (cloudData.inventory) this.inventory = [...cloudData.inventory];
          if (cloudData.suppliers) this.suppliers = [...cloudData.suppliers];
          if (cloudData.orderedItems) this.orderedItems = [...cloudData.orderedItems];
          this.persistLocal();
        },

        saveCloudConfig() {
          try {
             JSON.parse(this.cloudConfigText); // Validate JSON
             localStorage.setItem('pkg_cloud_config', this.cloudConfigText);
             this.showCloudModal = false;
             this.initFirebase();
             this.showToast('雲端設定已儲存並嘗試連線！');
          } catch(e) {
             this.showToast('JSON 格式錯誤，請檢查內容');
          }
        },

        // --- Core Data Management ---
        persistLocal() {
          localStorage.setItem('pkg_inventory', JSON.stringify(this.inventory));
          localStorage.setItem('pkg_suppliers', JSON.stringify(this.suppliers));
          localStorage.setItem('pkg_ordered_items', JSON.stringify(this.orderedItems));
        },

        saveInventory() {
          this.inventory = [...this.inventory]; // Trigger Alpine reactivity
          this.suppliers = [...this.suppliers];
          this.orderedItems = [...this.orderedItems];
          this.persistLocal();
          
          if (this.isCloudConnected && typeof firebase !== 'undefined' && firebase.apps.length) {
            firebase.database().ref('packagingData').set({
              inventory: this.inventory,
              suppliers: this.suppliers,
              orderedItems: this.orderedItems,
              lastUpdated: Date.now()
            }).catch(err => {
              console.error('雲端寫入失敗:', err);
              this.isCloudConnected = false;
            });
          }
        },

        // --- UI Interactions ---
        showToast(msg) {
          this.toast.message = msg;
          this.toast.show = true;
          clearTimeout(this.toast.timeout);
          this.toast.timeout = setTimeout(() => { this.toast.show = false; }, 2500);
        },

        confirmAction(message, callback) {
          this.confirmDialog.message = message;
          this.confirmDialog.onConfirm = callback;
          this.confirmDialog.show = true;
        },

        executeConfirm() {
          if (typeof this.confirmDialog.onConfirm === 'function') {
             this.confirmDialog.onConfirm();
          }
          this.confirmDialog.show = false;
        },

        openLightbox(item) {
          this.lightboxItem = item;
          this.showLightboxModal = true;
        },

        // --- Getters & Filters ---
        getFavoriteItems() {
          return this.inventory.filter(item => item.isFavorite);
        },

        getFilteredItemsBySupplier(supplier) {
          return this.inventory.filter(item => {
            const matchesSupplier = item.origin === supplier;
            const term = this.searchQuery.toLowerCase();
            const matchesSearch = !term || item.name.toLowerCase().includes(term) || (item.spec && item.spec.toLowerCase().includes(term));
            return matchesSupplier && matchesSearch;
          });
        },

        // --- Actions ---
        updateStock(item, delta) {
          item.currentStock = Math.max(0, item.currentStock + delta);
          this.saveInventory();
        },

        toggleFavorite(item) {
          item.isFavorite = !item.isFavorite;
          this.saveInventory();
          this.showToast(item.isFavorite ? '已加入常叫貨' : '已取消常叫貨');
        },

        deleteItem(itemId) {
          this.inventory = this.inventory.filter(i => i.id !== itemId);
          this.orderedItems = this.orderedItems.filter(i => i.id !== itemId);
          this.saveInventory();
          this.showToast('已刪除品項');
        },

        // --- Edit Item ---
        openEditModal(item) {
          this.editingItem = { 
            id: item.id, name: item.name, spec: item.spec || '', origin: item.origin, 
            safetyStock: item.safetyStock ?? 5, image: item.image || ''
          };
          this.showEditModal = true;
        },

        handleEditImageUpload(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => { this.editingItem.image = e.target.result; };
          reader.readAsDataURL(file);
        },

        saveEditedItem() {
          if(!this.editingItem.name.trim()) {
            this.showToast('品名不可為空'); return;
          }
          let item = this.inventory.find(i => i.id === this.editingItem.id);
          if(!item && this.editingItem.id === null) { // For completely new if needed later
             item = { id: Date.now(), isFavorite: false, currentStock: 0, unit: '個' };
             this.inventory.push(item);
          }
          if (item) {
            item.name = this.editingItem.name.trim();
            item.spec = this.editingItem.spec.trim();
            item.origin = this.editingItem.origin;
            item.safetyStock = Math.max(0, parseInt(this.editingItem.safetyStock) || 0);
            item.image = this.editingItem.image;
            this.saveInventory();
            this.showEditModal = false;
            this.showToast('儲存成功');
          }
        },

        // --- Order Features ---
        addToOrder(item) {
          const existing = this.orderedItems.find(o => o.id === item.id);
          if (existing) {
            this.orderedItems = this.orderedItems.filter(o => o.id !== item.id);
            this.showToast('已移除採購單');
          } else {
            this.orderedItems.push({ ...item, orderWeight: 1, orderNote: '' });
            this.showToast('加入採購單成功');
          }
          this.saveInventory();
        },
        isItemOrdered(itemId) { return this.orderedItems.some(o => o.id === itemId); },
        removeFromOrder(itemId) {
          this.orderedItems = this.orderedItems.filter(o => o.id !== itemId);
          this.saveInventory();
        },
        clearOrderList() {
          this.orderedItems = [];
          this.saveInventory();
          this.showToast('已清空清單');
        },
        get activeOrderSuppliers() { return [...new Set(this.orderedItems.map(i => i.origin))]; },
        getOrderedItemsBySupplier(supplier) { return this.orderedItems.filter(i => i.origin === supplier); },
        get currentDateFormatted() {
          const d = new Date();
          return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
        },

        // --- Supplier Management ---
        addSupplier() {
          const name = this.newSupplierName.trim();
          if (!name) return;
          if (!this.suppliers.includes(name)) {
            this.suppliers.push(name);
            if(!this.batchSupplier) this.batchSupplier = name;
            this.saveInventory();
            this.showToast('已新增廠商');
          }
          this.newSupplierName = '';
        },
        removeSupplier(sup) {
          this.suppliers = this.suppliers.filter(s => s !== sup);
          this.saveInventory();
          this.showToast('已移除廠商');
        },

        // --- Global Actions ---
        processBatchAdd() {
          if (!this.batchInputText.trim() || !this.batchSupplier) return;
          const lines = this.batchInputText.split('\n').filter(l => l.trim().length > 0);
          let count = 0;
          lines.forEach(line => {
            this.inventory.push({
              id: Date.now() + Math.random(), name: line.trim(), spec: '', origin: this.batchSupplier,
              unit: '個', currentStock: 0, safetyStock: 5, isFavorite: false, image: ''
            });
            count++;
          });
          this.batchInputText = '';
          this.showBatchModal = false;
          this.saveInventory();
          this.showToast(`成功批次新增 ${count} 筆`);
        },
        clearAllStock() {
          this.inventory.forEach(i => i.currentStock = 0);
          this.saveInventory();
          this.showToast('庫存已全數歸零');
        },
        clearSystemData() {
          this.inventory = [];
          this.orderedItems = [];
          this.saveInventory();
          this.showToast('資料已清空');
        },
        
        // --- Export/Import JSON ---
        exportData() {
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ inventory: this.inventory, suppliers: this.suppliers, orderedItems: this.orderedItems }, null, 2));
          const dl = document.createElement('a');
          dl.setAttribute("href", dataStr);
          dl.setAttribute("download", `包材備份_${this.currentDateFormatted.replace(/\//g,'-')}.json`);
          dl.click();
        },
        importData(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = JSON.parse(e.target.result);
              if (data.inventory) this.inventory = data.inventory;
              if (data.suppliers) this.suppliers = data.suppliers;
              if (data.orderedItems) this.orderedItems = data.orderedItems;
              this.saveInventory();
              this.showToast('備份還原成功');
            } catch (err) { this.showToast('檔案格式錯誤'); }
          };
          reader.readAsText(file);
        },

        // --- Export PDF ---
        async exportToPDF() {
          this.showToast('產生 PDF 中，請稍候...');
          const el = document.getElementById('printable-purchase-order');
          if (!el) return;
          try {
            const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const imgWidth = pdfWidth - 20;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 15, imgWidth, imgHeight);
            pdf.save(`採購單_${this.currentDateFormatted.replace(/\//g, '-')}.pdf`);
            this.showToast('PDF 匯出成功！');
          } catch (err) {
            this.showToast('PDF 產生失敗');
            console.error(err);
          }
        }
      };
    }
  </script>
</body>
</html>
