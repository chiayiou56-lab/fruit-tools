<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>包裝材料採購對照單與庫存管理系統</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Font: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Firebase App & Realtime Database SDK (v8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- html2canvas & jsPDF for clean A4 PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    [x-cloak] { display: none !important; }

    input, select, textarea, button {
      -webkit-appearance: none;
      border-radius: 0.5rem;
    }

    input[type="text"], input[type="number"], select, textarea {
      font-size: 16px !important;
    }

    @media (min-width: 640px) {
      input[type="text"], input[type="number"], select, textarea {
        font-size: 15px !important;
      }
    }

    input[type="number"] {
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { 
      -webkit-appearance: none;
      margin: 0; 
    }

    .touch-btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased pb-12" x-data="packagingApp()" x-cloak>

  <!-- TOP HEADER & NAVBAR -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md text-white">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-18 gap-2">
        
        <!-- App Title / Logo & Cloud Status -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-teal-500 via-cyan-400 to-blue-500 text-slate-950 flex items-center justify-center shadow-md shadow-teal-900/50 shrink-0">
            <i class="fa-solid fa-boxes-packing text-xl sm:text-2xl"></i>
          </div>
          <div>
            <h1 class="text-sm sm:text-lg font-bold text-white tracking-tight flex items-center gap-2">
              甜蜜果物-包材即時同步系統
              <!-- 雲端連線狀態指示燈 -->
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-2xs"
                    :class="isCloudConnected ? 'bg-emerald-500 text-slate-950' : 'bg-amber-500 text-slate-950'">
                <i class="fa-solid" :class="isCloudConnected ? 'fa-cloud' : 'fa-cloud-slash'"></i>
                <span x-text="isCloudConnected ? '雲端即時連線中' : '本機模式'"></span>
              </span>
            </h1>
          </div>
        </div>

        <!-- Navigation Tabs & Actions -->
        <div class="flex items-center gap-2 sm:gap-3">
          
          <!-- Cloud Settings Button -->
          <button @click="showCloudModal = true" class="touch-btn bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-teal-400 px-3 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 border border-slate-700" title="設定雲端同步">
            <i class="fa-solid fa-cloud-arrow-up text-base"></i> 雲端設定
          </button>

          <!-- Home Link Button -->
          <a href="index.html" class="touch-btn bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 px-3.5 sm:px-4 py-2 rounded-xl text-sm font-bold transition flex items-center gap-2 border border-slate-700">
            <i class="fa-solid fa-house text-slate-400 text-base"></i> 回首頁
          </a>

          <!-- Tab Switcher -->
          <div class="bg-slate-800 p-1.5 rounded-2xl flex gap-1.5 border border-slate-700 text-sm font-semibold">
            <button 
              @click="currentTab = 'inventory'"
              :class="currentTab === 'inventory' ? 'bg-teal-500 text-slate-950 shadow-xs' : 'text-slate-300 hover:text-white'"
              class="touch-btn px-3 sm:px-4 py-2 rounded-xl transition-all flex items-center gap-1.5 font-bold text-xs sm:text-sm">
              <i class="fa-solid fa-boxes-stacked"></i>
              庫存
            </button>
            <button 
              @click="currentTab = 'favorites'"
              :class="currentTab === 'favorites' ? 'bg-amber-400 text-slate-950 shadow-xs' : 'text-slate-300 hover:text-white'"
              class="touch-btn px-3 sm:px-4 py-2 rounded-xl transition-all flex items-center gap-1.5 font-bold text-xs sm:text-sm relative">
              <i class="fa-solid fa-star text-amber-500" :class="currentTab === 'favorites' ? 'text-slate-950' : ''"></i>
              常叫貨
              <span x-show="getFavoriteItems().length > 0" 
                    x-text="getFavoriteItems().length" 
                    class="ml-0.5 px-1.5 py-0.2 bg-slate-900 text-white text-[10px] rounded-full font-bold"></span>
            </button>
            <button 
              @click="currentTab = 'order'"
              :class="currentTab === 'order' ? 'bg-teal-500 text-slate-950 shadow-xs' : 'text-slate-300 hover:text-white'"
              class="touch-btn px-3 sm:px-4 py-2 rounded-xl transition-all flex items-center gap-1.5 relative font-bold text-xs sm:text-sm">
              <i class="fa-solid fa-clipboard-check"></i>
              叫貨
              <span x-show="orderedItems.length > 0" 
                    x-text="orderedItems.length" 
                    class="ml-0.5 px-1.5 py-0.2 bg-amber-400 text-slate-950 text-[10px] rounded-full font-bold"></span>
            </button>
          </div>

        </div>

      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 pt-5 sm:py-7">

    <!-- TOOLBAR & GLOBAL CONTROLS -->
    <div x-show="currentTab === 'inventory' || currentTab === 'favorites'" class="mb-6 bg-white p-4 sm:p-4.5 rounded-2xl border border-teal-100 shadow-xs flex flex-wrap items-center justify-between gap-3">
      
      <!-- Search & Quick Filters -->
      <div class="flex items-center gap-2.5 flex-1 min-w-[240px]">
        <div class="relative w-full max-w-sm">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input 
            type="text" 
            x-model="searchQuery" 
            placeholder="搜尋品名、規格、廠商..." 
            class="w-full pl-10 pr-3.5 py-2.5 text-sm sm:text-base bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition">
        </div>
      </div>

      <!-- Action Buttons Group -->
      <div class="flex items-center flex-wrap gap-2 text-sm">
        <button @click="showBatchModal = true" class="touch-btn bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-bold px-3.5 py-2 rounded-xl transition shadow-xs flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-base"></i> 批量新增
        </button>
        <button @click="showSupplierModal = true" class="touch-btn bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-2">
          <i class="fa-solid fa-industry text-teal-600 text-base"></i> 管理廠商
        </button>
        <button @click="exportData()" class="touch-btn bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5" title="匯出JSON備份檔">
          <i class="fa-solid fa-file-export text-slate-500 text-base"></i> 匯出
        </button>
        <label class="touch-btn bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold px-3 py-2 rounded-xl transition cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-file-import text-slate-500 text-base"></i> 匯入
          <input type="file" accept=".json" class="hidden" @change="importData($event)">
        </label>
        <button @click="confirmZeroStock()" class="touch-btn bg-amber-50 border border-amber-200 text-amber-700 hover:bg-amber-100 font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5" title="庫存歸零">
          <i class="fa-solid fa-arrow-rotate-left text-amber-600 text-base"></i> 歸零
        </button>
        <button @click="confirmClearAll()" class="touch-btn bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100 font-bold px-3 py-2 rounded-xl transition flex items-center gap-1.5" title="清空系統資料">
          <i class="fa-solid fa-trash-can text-rose-600 text-base"></i> 清空
        </button>
      </div>
    </div>

    <!-- TAB 1: INVENTORY MANAGEMENT -->
    <div x-show="currentTab === 'inventory'" class="space-y-6">
      <template x-for="supplier in suppliers" :key="supplier">
        <div x-show="getFilteredItemsBySupplier(supplier).length > 0 || !searchQuery" 
             class="rounded-2xl border p-4 sm:p-5 transition-all space-y-4"
             :class="getSupplierBlockStyle(supplier)">
          
          <div class="flex items-center justify-between border-b pb-3" :class="getSupplierHeaderBorderStyle(supplier)">
            <div class="flex items-center gap-3">
              <span class="w-9 h-9 rounded-xl flex items-center justify-center text-base font-bold shadow-xs text-white" :class="getSupplierBadgeStyle(supplier)">
                <i class="fa-solid fa-building"></i>
              </span>
              <div>
                <h2 class="text-sm sm:text-base font-bold tracking-tight flex items-center gap-2.5" :class="getSupplierTitleTextStyle(supplier)">
                  <span x-text="supplier"></span>
                  <span class="text-xs font-semibold opacity-75" x-text="'(' + getFilteredItemsBySupplier(supplier).length + ' 品項)'"></span>
                </h2>
              </div>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full font-bold uppercase tracking-wider" :class="getSupplierTagStyle(supplier)" x-text="supplier"></span>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">
            <template x-for="item in getFilteredItemsBySupplier(supplier)" :key="item.id">
              <div class="rounded-2xl border p-3.5 sm:p-4 transition shadow-xs hover:shadow flex flex-col justify-between relative group"
                   :class="[getItemCardBgStyle(supplier), item.currentStock <= item.safetyStock ? 'border-amber-400 ring-2 ring-amber-300' : '']">
                <div>
                  <div class="flex items-start justify-between gap-1 mb-1.5">
                    <button @click="toggleFavorite(item)" class="touch-btn p-1 text-lg focus:outline-none transition transform active:scale-125">
                      <i class="fa-solid fa-star" :class="item.isFavorite ? 'text-amber-400 fill-amber-400' : 'text-slate-300 hover:text-amber-300'"></i>
                    </button>
                    <div class="flex-1 px-1">
                      <h3 class="text-sm sm:text-base font-bold text-slate-900 leading-snug line-clamp-2" x-text="item.name"></h3>
                      <p class="text-xs text-slate-600 font-semibold mt-1" x-text="item.spec ? '規格: ' + item.spec : '標準規格'"></p>
                    </div>
                    <div class="flex items-center gap-0.5">
                      <button @click="openEditModal(item)" class="touch-btn text-slate-400 hover:text-teal-600 text-xs p-1.5 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                      <button @click="deleteItem(item.id)" class="touch-btn text-slate-300 hover:text-rose-500 text-xs p-1.5 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                  </div>

                  <div x-show="item.currentStock <= item.safetyStock" class="mb-2">
                    <span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded-md flex items-center gap-1 w-max">
                      <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> 低於安全庫存
                    </span>
                  </div>

                  <div class="bg-white/90 backdrop-blur-xs p-2.5 sm:p-3 rounded-xl border border-slate-200/80 flex flex-col gap-2 my-2.5">
                    <div class="flex items-center justify-between text-xs text-slate-600 font-bold">
                      <span>現有庫存</span>
                      <select x-model="item.unit" @change="saveInventory()" class="bg-white border border-slate-300 text-slate-900 text-sm rounded-lg px-2.5 py-1 focus:outline-none font-bold shadow-2xs">
                        <option value="個">個</option><option value="包">包</option><option value="瓶">瓶</option><option value="箱">箱</option>
                      </select>
                    </div>
                    <div class="flex items-center justify-between gap-2 mt-0.5">
                      <button @click="updateStock(item, -1)" class="touch-btn w-11 h-11 bg-white border-2 border-slate-300 rounded-xl text-slate-800 hover:bg-slate-100 text-lg font-extrabold flex items-center justify-center shadow-xs">-</button>
                      <input type="number" inputmode="numeric" :value="item.currentStock ?? 0"
                             @input="item.currentStock = $event.target.value === '' ? 0 : Math.max(0, parseInt($event.target.value) || 0); saveInventory()"
                             @blur="if (item.currentStock === '' || isNaN(item.currentStock)) item.currentStock = 0; saveInventory()"
                             class="w-16 h-11 text-center text-base sm:text-lg font-black bg-white border-2 border-teal-500 rounded-xl shadow-inner text-slate-900 focus:outline-none">
                      <button @click="updateStock(item, 1)" class="touch-btn w-11 h-11 bg-white border-2 border-slate-300 rounded-xl text-slate-800 hover:bg-slate-100 text-lg font-extrabold flex items-center justify-center shadow-xs">+</button>
                    </div>
                  </div>
                </div>

                <div class="pt-2 mt-1 border-t border-slate-200/60 flex items-center justify-between gap-1">
                  <div class="text-xs text-slate-500 font-medium">預警: <span class="font-bold" x-text="item.safetyStock"></span></div>
                  <button @click="addToOrder(item)" :class="isItemOrdered(item.id) ? 'bg-amber-500 text-white' : 'bg-teal-700 text-white'"
                          class="touch-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid" :class="isItemOrdered(item.id) ? 'fa-check' : 'fa-plus'"></i>
                    <span x-text="isItemOrdered(item.id) ? '已叫貨' : '+ 叫貨'"></span>
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- TAB 2: FAVORITES -->
    <div x-show="currentTab === 'favorites'" class="space-y-6">
      <div class="rounded-2xl border p-4 sm:p-6 transition-all space-y-4 bg-amber-50/70 border-amber-300 shadow-xs">
        <div class="flex items-center justify-between border-b border-amber-300 pb-3.5">
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl flex items-center justify-center text-lg font-bold shadow-xs text-white bg-amber-500"><i class="fa-solid fa-star"></i></span>
            <div>
              <h2 class="text-base sm:text-lg font-bold tracking-tight text-amber-950">常叫貨包材專區</h2>
              <p class="text-xs sm:text-sm text-amber-900">集中管理所有標記星號的常用包材</p>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4">
          <template x-for="item in getFavoriteItems()" :key="'fav-' + item.id">
            <div class="rounded-2xl border p-3.5 sm:p-4 transition shadow-xs hover:shadow flex flex-col justify-between relative group bg-amber-100/70 border-amber-300">
              <div>
                <div class="flex items-start justify-between gap-1 mb-1.5">
                  <button @click="toggleFavorite(item)" class="touch-btn p-1 text-lg"><i class="fa-solid fa-star text-amber-500 fill-amber-500"></i></button>
                  <div class="flex-1 px-1">
                    <h3 class="text-sm sm:text-base font-bold text-slate-900 line-clamp-2" x-text="item.name"></h3>
                    <p class="text-xs text-slate-600 font-semibold mt-1" x-text="item.spec || '標準規格'"></p>
                  </div>
                  <div class="flex items-center gap-0.5">
                    <button @click="openEditModal(item)" class="touch-btn text-slate-400 hover:text-teal-600 text-xs p-1.5"><i class="fa-solid fa-pen-to-square"></i></button>
                    <button @click="deleteItem(item.id)" class="touch-btn text-slate-300 hover:text-rose-500 text-xs p-1.5"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
                <div class="bg-white/90 p-2.5 rounded-xl border border-amber-200/80 flex flex-col gap-2 my-2.5">
                  <div class="flex items-center justify-between text-xs text-slate-600 font-bold">
                    <span>現有庫存</span>
                    <select x-model="item.unit" @change="saveInventory()" class="bg-white border rounded-lg px-2.5 py-1 text-sm font-bold">
                      <option value="個">個</option><option value="包">包</option><option value="瓶">瓶</option><option value="箱">箱</option>
                    </select>
                  </div>
                  <div class="flex items-center justify-between gap-2 mt-0.5">
                    <button @click="updateStock(item, -1)" class="touch-btn w-11 h-11 bg-white border-2 rounded-xl text-lg font-extrabold">-</button>
                    <input type="number" :value="item.currentStock ?? 0" @input="item.currentStock = Math.max(0, parseInt($event.target.value) || 0); saveInventory()" class="w-16 h-11 text-center font-black border-2 border-amber-500 rounded-xl">
                    <button @click="updateStock(item, 1)" class="touch-btn w-11 h-11 bg-white border-2 rounded-xl text-lg font-extrabold">+</button>
                  </div>
                </div>
              </div>
              <div class="pt-2 mt-1 border-t border-amber-200/60 flex items-center justify-between">
                <span class="text-xs font-bold text-amber-950" x-text="item.origin"></span>
                <button @click="addToOrder(item)" class="touch-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-teal-700 text-white">
                  <span x-text="isItemOrdered(item.id) ? '已叫貨' : '+ 叫貨'"></span>
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- TAB 3: ORDER SHEET -->
    <div x-show="currentTab === 'order'" class="space-y-6">
      <div class="bg-white p-4.5 rounded-2xl border border-teal-100 shadow-xs flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-base sm:text-lg font-bold text-slate-900">今日採購叫貨清單</h2>
          <p class="text-xs sm:text-sm text-slate-600">已選取 <span x-text="orderedItems.length" class="font-bold text-teal-600"></span> 項包材</p>
        </div>
        <div class="flex items-center gap-2.5">
          <button @click="clearOrderList()" x-show="orderedItems.length > 0" class="touch-btn bg-slate-100 text-slate-700 text-sm font-bold px-3.5 py-2 rounded-xl">清空</button>
          <button @click="exportToPDF()" x-show="orderedItems.length > 0" class="touch-btn bg-teal-600 text-white text-sm font-bold px-4.5 py-2.5 rounded-xl shadow-xs"><i class="fa-solid fa-file-pdf mr-1.5"></i> 匯出 PDF</button>
        </div>
      </div>

      <div x-show="orderedItems.length > 0" class="flex justify-center py-2">
        <div id="printable-purchase-order" class="w-full max-w-[760px] bg-white p-5 rounded-2xl border shadow-sm space-y-6 text-sm">
          <div class="text-center border-b pb-4">
            <h1 class="text-lg font-bold text-slate-900">甜蜜果物 - 包裝材料採購對照單</h1>
            <div class="text-xs text-slate-600 mt-1">日期：<span x-text="currentDateFormatted"></span></div>
          </div>
          <div class="space-y-6">
            <template x-for="supplier in activeOrderSuppliers" :key="supplier">
              <div class="rounded-2xl border shadow-xs overflow-hidden bg-slate-50">
                <div class="px-4.5 py-3 font-bold bg-slate-200 text-slate-900 flex justify-between items-center text-sm">
                  <span x-text="supplier + ' 採購單'"></span>
                </div>
                <div class="p-3.5 overflow-x-auto">
                  <table class="w-full text-left text-sm">
                    <thead>
                      <tr class="text-slate-600 border-b text-xs font-bold">
                        <th class="pb-2.5 px-2">品名</th>
                        <th class="pb-2.5 px-2">數量</th>
                        <th class="pb-2.5 px-2">備註</th>
                        <th class="pb-2.5 text-right px-2">操作</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y">
                      <template x-for="item in getOrderedItemsBySupplier(supplier)" :key="item.id">
                        <tr>
                          <td class="py-3 px-2 font-bold" x-text="item.name"></td>
                          <td class="py-3 px-2">
                            <div class="inline-flex items-center border-2 rounded-xl p-1 gap-1">
                              <button @click="item.orderWeight = Math.max(0, item.orderWeight - 1); saveInventory()" class="w-8 h-8 font-black">-</button>
                              <input type="number" x-model.number="item.orderWeight" @input="saveInventory()" class="w-12 text-center font-black bg-transparent">
                              <button @click="item.orderWeight = Math.max(0, item.orderWeight + 1); saveInventory()" class="w-8 h-8 font-black">+</button>
                            </div>
                          </td>
                          <td class="py-3 px-2"><input type="text" x-model="item.orderRemark" @input="saveInventory()" placeholder="備註..." class="w-32 px-2 py-1 border rounded-lg"></td>
                          <td class="py-3 px-2 text-right"><button @click="removeFromOrder(item.id)" class="text-rose-600"><i class="fa-solid fa-trash-can"></i></button></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- CLOUD SETTINGS MODAL -->
  <div x-show="showCloudModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4" x-transition.opacity>
    <div @click.away="showCloudModal = false" class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-cloud text-teal-600 text-lg"></i> Firebase 即時雲端同步設定
        </h3>
        <button @click="showCloudModal = false" class="touch-btn text-slate-400 p-2"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3 text-sm">
        <p class="text-xs text-slate-500">請貼上從 Firebase 專案設定中複製的資料庫設定。設定完成後，PC 與 iPad 只要開著網頁即可自動雙向同步。</p>
        <div>
          <label class="block font-bold text-slate-700 mb-1">Firebase Config (JSON 格式)</label>
          <textarea x-model="cloudConfigText" rows="6" placeholder='{
  "apiKey": "你的API",
  "databaseURL": "https://your-app-default-rtdb.firebaseio.com",
  "projectId": "your-app"
}' class="w-full p-3 border-2 rounded-xl font-mono text-xs bg-slate-50"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-3 border-t">
        <button @click="showCloudModal = false" class="touch-btn px-4 py-2 border-2 rounded-xl font-bold">取消</button>
        <button @click="saveCloudConfig()" class="touch-btn px-5 py-2 bg-teal-600 text-white rounded-xl font-bold">儲存並連線</button>
      </div>
    </div>
  </div>

  <!-- MODALS: Batch Add, Edit, Supplier Management -->
  <div x-show="showBatchModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4" x-transition.opacity>
    <div @click.away="showBatchModal = false" class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b pb-4">
        <h3 class="text-base font-bold text-slate-900">批量新增包材品項</h3>
        <button @click="showBatchModal = false" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <textarea x-model="batchInputText" rows="6" placeholder="例如：瓦楞紙箱 3號,5號 必堅" class="w-full p-3.5 border-2 rounded-xl font-mono text-sm"></textarea>
      </div>
      <div class="flex justify-end gap-3 pt-4 border-t">
        <button @click="showBatchModal = false" class="px-5 py-2.5 border-2 rounded-xl font-bold">取消</button>
        <button @click="processBatchAdd()" class="px-6 py-2.5 bg-sky-600 text-white rounded-xl font-bold">確認導入</button>
      </div>
    </div>
  </div>

  <div x-show="showEditModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4" x-transition.opacity>
    <div @click.away="showEditModal = false" class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-base font-bold text-slate-900">編輯包材品項</h3>
        <button @click="showEditModal = false" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3.5 text-sm">
        <input type="text" x-model="editingItem.name" placeholder="品名" class="w-full p-3 border-2 rounded-xl font-bold">
        <input type="text" x-model="editingItem.spec" placeholder="規格" class="w-full p-3 border-2 rounded-xl">
        <select x-model="editingItem.origin" class="w-full p-3 border-2 rounded-xl font-bold">
          <template x-for="sup in suppliers" :key="sup"><option :value="sup" x-text="sup"></option></template>
        </select>
        <input type="number" x-model.number="editingItem.safetyStock" placeholder="安全庫存" class="w-full p-3 border-2 rounded-xl text-center font-bold">
      </div>
      <div class="flex justify-end gap-2.5 pt-3 border-t">
        <button @click="showEditModal = false" class="px-4 py-2 border-2 rounded-xl font-bold">取消</button>
        <button @click="saveEditedItem()" class="px-5 py-2 bg-teal-600 text-white rounded-xl font-bold">儲存變更</button>
      </div>
    </div>
  </div>

  <div x-show="showSupplierModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4" x-transition.opacity>
    <div @click.away="showSupplierModal = false" class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b pb-4">
        <h3 class="text-base font-bold">管理廠商列表</h3>
        <button @click="showSupplierModal = false" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <div class="flex gap-2">
          <input type="text" x-model="newSupplierName" placeholder="新廠商名稱" class="flex-1 px-3.5 py-2.5 border-2 rounded-xl font-bold">
          <button @click="addSupplier()" class="px-4 py-2.5 bg-sky-600 text-white rounded-xl font-bold">新增</button>
        </div>
        <div class="border-2 rounded-2xl divide-y max-h-52 overflow-y-auto">
          <template x-for="sup in suppliers" :key="sup">
            <div class="p-3 flex items-center justify-between">
              <span class="font-bold" x-text="sup"></span>
              <button x-show="sup !== '必堅' && sup !== '利泰' && sup !== '淘寶'" @click="removeSupplier(sup)" class="text-rose-600"><i class="fa-solid fa-trash"></i></button>
            </div>
          </template>
        </div>
      </div>
      <div class="flex justify-end pt-3 border-t"><button @click="showSupplierModal = false" class="px-5 py-2.5 bg-slate-100 rounded-xl font-bold">關閉</button></div>
    </div>
  </div>

  <!-- TOAST -->
  <div x-show="toast.show" x-transition class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white text-sm px-5 py-3.5 rounded-2xl shadow-xl flex items-center gap-2.5 font-bold">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span x-text="toast.message"></span>
  </div>

  <!-- APP SCRIPT WITH FIREBASE SYNC -->
  <script>
    function packagingApp() {
      return {
        currentTab: 'inventory',
        searchQuery: '',
        showBatchModal: false,
        showSupplierModal: false,
        showEditModal: false,
        showCloudModal: false,
        isCloudConnected: false,

        batchSupplier: '必堅',
        batchUnit: '個',
        batchInputText: '',
        newSupplierName: '',
        cloudConfigText: localStorage.getItem('pkg_cloud_config') || '',

        editingItem: { id: null, name: '', spec: '', origin: '', safetyStock: 5 },
        toast: { show: false, message: '' },

        suppliers: JSON.parse(localStorage.getItem('pkg_suppliers')) || ['必堅', '利泰', '淘寶'],
        inventory: JSON.parse(localStorage.getItem('pkg_inventory')) || [
          { id: 1, name: '瓦楞外箱 5號', spec: '標準規格', origin: '必堅', unit: '箱', currentStock: 12, safetyStock: 5, isFavorite: true },
          { id: 2, name: '彩色印刷禮盒', spec: '水果6入裝', origin: '必堅', unit: '個', currentStock: 30, safetyStock: 10, isFavorite: false },
          { id: 3, name: '透明封箱膠帶', spec: '48mm x 90y', origin: '利泰', unit: '包', currentStock: 8, safetyStock: 10, isFavorite: true },
          { id: 4, name: '防震氣泡袋', spec: '30cm x 30cm', origin: '利泰', unit: '包', currentStock: 25, safetyStock: 5, isFavorite: false },
          { id: 5, name: '客製化提袋', spec: '大號藍色', origin: '淘寶', unit: '個', currentStock: 2, safetyStock: 20, isFavorite: true },
          { id: 6, name: '網狀水果護套', spec: '12cm白色', origin: '淘寶', unit: '包', currentStock: 15, safetyStock: 5, isFavorite: false }
        ],
        orderedItems: JSON.parse(localStorage.getItem('pkg_ordered_items')) || [],

        init() {
          this.initFirebase();
        },

        initFirebase() {
          if (!this.cloudConfigText.trim()) return;
          try {
            let config = JSON.parse(this.cloudConfigText);
            if (!firebase.apps.length) {
              firebase.initializeApp(config);
            }
            const dbRef = firebase.database().ref('packagingData');
            
            dbRef.on('value', (snapshot) => {
              const cloudData = snapshot.val();
              if (cloudData) {
                if (cloudData.inventory) this.inventory = cloudData.inventory;
                if (cloudData.suppliers) this.suppliers = cloudData.suppliers;
                if (cloudData.orderedItems) this.orderedItems = cloudData.orderedItems;
                localStorage.setItem('pkg_inventory', JSON.stringify(this.inventory));
                localStorage.setItem('pkg_suppliers', JSON.stringify(this.suppliers));
                localStorage.setItem('pkg_ordered_items', JSON.stringify(this.orderedItems));
                this.isCloudConnected = true;
              }
            });
            this.isCloudConnected = true;
          } catch (e) {
            console.error('Firebase 連結失敗:', e);
            this.isCloudConnected = false;
          }
        },

        saveCloudConfig() {
          localStorage.setItem('pkg_cloud_config', this.cloudConfigText);
          this.showCloudModal = false;
          this.initFirebase();
          this.showToast('雲端設定已儲存並重新連線！');
        },

        saveInventory() {
          localStorage.setItem('pkg_inventory', JSON.stringify(this.inventory));
          localStorage.setItem('pkg_suppliers', JSON.stringify(this.suppliers));
          localStorage.setItem('pkg_ordered_items', JSON.stringify(this.orderedItems));
          
          if (this.isCloudConnected && firebase.apps.length) {
            firebase.database().ref('packagingData').set({
              inventory: this.inventory,
              suppliers: this.suppliers,
              orderedItems: this.orderedItems
            });
          }
        },

        showToast(msg) {
          this.toast.message = msg;
          this.toast.show = true;
          setTimeout(() => { this.toast.show = false; }, 2500);
        },

        getSupplierBlockStyle(supplier) {
          switch (supplier) {
            case '必堅': return 'bg-blue-50/80 border-blue-200/90 shadow-xs';
            case '利泰': return 'bg-emerald-50/80 border-emerald-200/90 shadow-xs';
            case '淘寶': return 'bg-amber-50/80 border-amber-200/90 shadow-xs';
            default: return 'bg-slate-50/50 border-slate-200 shadow-xs';
          }
        },
        getSupplierHeaderBorderStyle(supplier) {
          return supplier === '必堅' ? 'border-blue-300' : (supplier === '利泰' ? 'border-emerald-300' : (supplier === '淘寶' ? 'border-amber-300' : 'border-slate-200'));
        },
        getSupplierBadgeStyle(supplier) {
          return supplier === '必堅' ? 'bg-blue-600' : (supplier === '利泰' ? 'bg-emerald-600' : (supplier === '淘寶' ? 'bg-amber-600' : 'bg-slate-600'));
        },
        getSupplierTitleTextStyle(supplier) {
          return supplier === '必堅' ? 'text-blue-950' : (supplier === '利泰' ? 'text-emerald-950' : (supplier === '淘寶' ? 'text-amber-950' : 'text-slate-900'));
        },
        getSupplierTagStyle(supplier) {
          return supplier === '必堅' ? 'bg-blue-200 text-blue-900 font-bold' : (supplier === '利泰' ? 'bg-emerald-200 text-emerald-900 font-bold' : (supplier === '淘寶' ? 'bg-amber-200 text-amber-900 font-bold' : 'bg-slate-200 text-slate-800'));
        },
        getItemCardBgStyle(supplier) {
          return supplier === '必堅' ? 'bg-blue-100/80 border-blue-300' : (supplier === '利泰' ? 'bg-emerald-100/80 border-emerald-300' : (supplier === '淘寶' ? 'bg-amber-100/80 border-amber-300' : 'bg-white border-slate-200'));
        },

        getFavoriteItems() {
          return this.inventory.filter(item => {
            const matchesSearch = !this.searchQuery || item.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || (item.spec && item.spec.toLowerCase().includes(this.searchQuery.toLowerCase()));
            return item.isFavorite && matchesSearch;
          });
        },

        getFilteredItemsBySupplier(supplier) {
          return this.inventory.filter(item => {
            const matchesSupplier = item.origin === supplier;
            const matchesSearch = !this.searchQuery || item.name.toLowerCase().includes(this.searchQuery.toLowerCase()) || (item.spec && item.spec.toLowerCase().includes(this.searchQuery.toLowerCase()));
            return matchesSupplier && matchesSearch;
          });
        },

        updateStock(item, delta) {
          item.currentStock = Math.max(0, item.currentStock + delta);
          this.saveInventory();
        },

        openEditModal(item) {
          this.editingItem = { id: item.id, name: item.name, spec: item.spec || '', origin: item.origin, safetyStock: item.safetyStock ?? 5 };
          this.showEditModal = true;
        },

        saveEditedItem() {
          const item = this.inventory.find(i => i.id === this.editingItem.id);
          if (item) {
            item.name = this.editingItem.name.trim();
            item.spec = this.editingItem.spec.trim();
            item.origin = this.editingItem.origin;
            item.safetyStock = Math.max(0, parseInt(this.editingItem.safetyStock) || 0);
            this.saveInventory();
            this.showEditModal = false;
            this.showToast('品項資料更新成功');
          }
        },

        toggleFavorite(item) {
          item.isFavorite = !item.isFavorite;
          this.saveInventory();
          this.showToast(item.isFavorite ? '已設為常叫包材' : '已取消常叫標記');
        },

        deleteItem(itemId) {
          if (confirm('確定要刪除這個包材品項嗎？')) {
            this.inventory = this.inventory.filter(i => i.id !== itemId);
            this.orderedItems = this.orderedItems.filter(i => i.id !== itemId);
            this.saveInventory();
            this.showToast('已刪除品項');
          }
        },

        addToOrder(item) {
          const existing = this.orderedItems.find(o => o.id === item.id);
          if (existing) {
            this.orderedItems = this.orderedItems.filter(o => o.id !== item.id);
            this.showToast(`已從叫貨單移除「${item.name}」`);
          } else {
            this.orderedItems.push({ ...item, orderBox: 1, orderWeight: 0, orderRemark: '' });
            this.showToast(`已加入叫貨單：「${item.name}」`);
          }
          this.saveInventory();
        },

        isItemOrdered(itemId) {
          return this.orderedItems.some(o => o.id === itemId);
        },

        removeFromOrder(itemId) {
          this.orderedItems = this.orderedItems.filter(o => o.id !== itemId);
          this.saveInventory();
        },

        clearOrderList() {
          if (confirm('確定要清空今日叫貨清單嗎？')) {
            this.orderedItems = [];
            this.saveInventory();
            this.showToast('已清空叫貨清單');
          }
        },

        get activeOrderSuppliers() {
          return [...new Set(this.orderedItems.map(i => i.origin))];
        },

        getOrderedItemsBySupplier(supplier) {
          return this.orderedItems.filter(i => i.origin === supplier);
        },

        get currentDateFormatted() {
          const today = new Date();
          return `${today.getFullYear()}/${today.getMonth() + 1}/${today.getDate()}`;
        },

        addSupplier() {
          if (!this.newSupplierName.trim()) return;
          if (!this.suppliers.includes(this.newSupplierName.trim())) {
            this.suppliers.push(this.newSupplierName.trim());
            this.newSupplierName = '';
            this.saveInventory();
            this.showToast('已新增廠商');
          }
        },

        removeSupplier(sup) {
          if (confirm(`確定要刪除廠商「${sup}」嗎？`)) {
            this.suppliers = this.suppliers.filter(s => s !== sup);
            this.saveInventory();
          }
        },

        processBatchAdd() {
          if (!this.batchInputText.trim()) return;
          const lines = this.batchInputText.split('\n').filter(l => l.trim().length > 0);
          let addedCount = 0;
          lines.forEach(line => {
            let itemSupplier = this.batchSupplier;
            let text = line.trim();
            this.suppliers.forEach(sup => {
              if (text.includes(sup)) { itemSupplier = sup; text = text.replace(sup, '').trim(); }
            });
            this.inventory.push({
              id: Date.now() + Math.random(),
              name: text,
              spec: '',
              origin: itemSupplier,
              unit: this.batchUnit,
              currentStock: 0,
              safetyStock: 5,
              isFavorite: false
            });
            addedCount++;
          });
          this.batchInputText = '';
          this.showBatchModal = false;
          this.saveInventory();
          this.showToast(`順利批次新增 ${addedCount} 個品項`);
        },

        confirmZeroStock() {
          if (confirm('確定要把所有品項庫存批次歸 0 嗎？')) {
            this.inventory.forEach(i => i.currentStock = 0);
            this.saveInventory();
            this.showToast('庫存已全數歸零');
          }
        },

        confirmClearAll() {
          if (confirm('警告：確定要清空所有資料嗎？')) {
            this.inventory = [];
            this.orderedItems = [];
            this.saveInventory();
            this.showToast('已清空');
          }
        },

        exportData() {
          const now = new Date();
          const fileName = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}包材資料.json`;
          const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ inventory: this.inventory, suppliers: this.suppliers, orderedItems: this.orderedItems }, null, 2));
          const dlAnchorElem = document.createElement('a');
          dlAnchorElem.setAttribute("href", dataStr);
          dlAnchorElem.setAttribute("download", fileName);
          dlAnchorElem.click();
          this.showToast(`備份檔已下載`);
        },

        importData(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = JSON.parse(e.target.result);
              if (data.inventory) this.inventory = data.inventory;
              if (data.suppliers) this.suppliers = data.suppliers;
              if (data.orderedItems) this.orderedItems = data.orderedItems;
              this.saveInventory();
              this.showToast('備份還原成功');
            } catch (err) { alert('格式錯誤'); }
          };
          reader.readAsText(file);
        },

        async exportToPDF() {
          this.showToast('正在生成 PDF...');
          const element = document.getElementById('printable-purchase-order');
          if (!element) return;
          try {
            const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const imgWidth = pdfWidth - 20;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 10, 15, imgWidth, imgHeight);
            pdf.save(`採購單_${this.currentDateFormatted.replace(/\//g, '-')}.pdf`);
            this.showToast('PDF 匯出成功！');
          } catch (error) { alert('發生錯誤'); }
        }
      };
    }
  </script>
