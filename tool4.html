                             @input="saveData()"
                             placeholder="例如：急用、請注意尺寸..." 
                             class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs sm:text-sm text-slate-800 focus:outline-none focus:border-emerald-500 transition">
                    </div>

                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- SECTION 2: PRINTABLE/PDF SUMMARY TABLE -->
    <div class="pt-6">
      <div class="flex items-center gap-2 px-1 mb-4">
        <span class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center text-sm font-bold"><i class="fa-solid fa-file-lines"></i></span>
        <div>
          <h3 class="text-base font-black text-slate-900">第二個區塊：採購叫貨精簡摘要（A4 PDF 匯出預覽）</h3>
          <p class="text-xs text-slate-500">系統將自動彙整上方資料，供對帳核對與匯出使用</p>
        </div>
      </div>

      <div class="flex justify-center">
        <div id="printable-purchase-order" class="w-full max-w-[800px] bg-white p-7 sm:p-9 rounded-3xl border border-slate-200 shadow-lg space-y-6 text-sm">
          
          <!-- Report Header -->
          <div class="text-center border-b border-slate-200 pb-5 space-y-1.5">
            <h1 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">甜蜜果物 - 包裝材料採購單</h1>
            <div class="text-xs sm:text-sm text-slate-500 font-bold">
              建立日期：<span x-text="formattedDate" class="text-slate-800"></span> &nbsp;&nbsp;|&nbsp;&nbsp; 總叫貨品項：<span x-text="orderList.length" class="text-emerald-600 font-black"></span> 項
            </div>
          </div>

          <!-- Supplier Summary Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <template x-for="supplier in activeOrderSuppliers" :key="'summary-' + supplier">
              <div class="rounded-2xl border shadow-2xs overflow-hidden flex flex-col justify-between bg-slate-50/50"
                   :class="getOrderSupplierBlockStyle(supplier)">
                <div>
                  <div class="px-4 py-3 border-b flex items-center justify-between"
                       :class="getOrderSupplierHeaderStyle(supplier)">
                    <h4 class="font-black flex items-center gap-2 text-sm" :class="getOrderSupplierTitleStyle(supplier)">
                      <i class="fa-solid fa-building"></i>
                      <span x-text="supplier"></span>
                    </h4>
                    <span class="text-xs px-2.5 py-0.5 rounded-full font-black shadow-2xs"
                          :class="getOrderSupplierBadgeStyle(supplier)"
                          x-text="getOrderedBySupplier(supplier).length + ' 項'"></span>
                  </div>

                  <div class="p-3">
                    <table class="w-full text-left text-xs sm:text-sm">
                      <thead>
                        <tr class="text-slate-400 border-b border-slate-200 text-xs font-bold">
                          <th class="pb-2 px-2">品名規格</th>
                          <th class="pb-2 px-2 text-center w-28">叫貨數量</th>
                          <th class="pb-2 px-2">備註</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-200/60">
                        <template x-for="item in getOrderedBySupplier(supplier)" :key="'summary-item-' + item.id">
                          <tr>
                            <td class="py-2.5 px-2 font-black text-slate-900">
                              <div x-text="item.name"></div>
                              <div class="text-[11px] text-slate-500 font-medium" x-text="item.spec"></div>
                            </td>
                            <td class="py-2.5 px-2 text-center font-black text-emerald-700">
                              <span x-text="item.orderWeight + ' ' + item.unit"></span>
                            </td>
                            <td class="py-2.5 px-2 text-slate-600 text-xs font-medium">
                              <span x-text="item.orderNote || '-'"></span>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Footer Signature -->
          <div class="pt-6 mt-6 border-t border-slate-200 flex items-center justify-between text-xs text-slate-400 font-bold">
            <div>採購審核簽章：___________________________</div>
            <div>甜蜜果物庫存系統 • A4 採購報表</div>
          </div>

        </div>
      </div>
    </div>

  </div>
</div>


  <div class="py-2">
    <template x-if="lightboxItem && lightboxItem.image">
      <div class="space-y-3">
        <img :src="lightboxItem.image" class="w-full max-h-[60vh] object-contain rounded-2xl border bg-slate-50 shadow-sm mx-auto">
        <p class="text-xs text-slate-500 font-bold" x-text="lightboxItem.spec ? '規格：' + lightboxItem.spec : '標準規格'"></p>
      </div>
    </template>
    <template x-if="lightboxItem && !lightboxItem.image">
      <div class="py-12 space-y-3 text-slate-400">
        <i class="fa-solid fa-image text-4xl"></i>
        <p class="text-sm font-bold">此品項尚未上傳實物照片</p>
        <p class="text-xs">請點選品項編輯按鈕上傳照片</p>
      </div>
    </template>
  </div>

  <div class="pt-3 border-t flex justify-end">
    <button @click="showLightbox = false" class="touch-btn px-5 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-sm">關閉</button>
  </div>
</div>
