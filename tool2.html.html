<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果店進貨解析與售價精算系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }
        
        /* 列印/PDF 匯出專用樣式 */
        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            #summary-section {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
            }
            .summary-card {
                box-shadow: none !important;
                border: 1px solid #ccc !important;
            }
            @page {
                size: A4 portrait;
                margin: 1.5cm;
            }
        }
    </style>
</head>
<body class="p-3 md:p-6 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- 頂部標頭與頂部日期顯示 -->
        <header class="bg-white rounded-xl shadow-md p-5 border-l-8 border-emerald-500 no-print">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-apple-whole text-emerald-600"></i> 水果店進貨解析與售價精算
                    </h1>
                    <p class="text-sm text-gray-500 mt-1">複製軟體進貨文字 ➔ 自動提取解析 ➔ 微調損耗毛利 ➔ 一鍵生成 50% 寬度摘要單/PDF</p>
                </div>
                <div class="flex flex-wrap items-center gap-3">
                    <!-- 🏠 回首頁按鈕 -->
                    <a href="index.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-house text-emerald-600"></i> 回首頁
                    </a>
                    
                    <div class="bg-emerald-50 px-4 py-2 rounded-lg border border-emerald-200 text-emerald-800 text-sm font-semibold flex items-center gap-2">
                        <i class="fa-regular fa-calendar-days text-emerald-600"></i>
                        <span>進貨日期：</span>
                        <input type="date" id="top-date-picker" class="bg-transparent border-b border-emerald-400 focus:outline-none font-bold text-emerald-900">
                    </div>
                    <!-- 一鍵清空按鈕 -->
                    <button onclick="clearAllData()" class="bg-rose-500 hover:bg-rose-600 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center gap-1.5 text-sm">
                        <i class="fa-solid fa-trash-can"></i> 一鍵清空所有資料
                    </button>
                </div>
            </div>
        </header>

        <!-- 第一步：貼上與解析明細 -->
        <section class="bg-white rounded-xl shadow-md p-5 no-print">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <span class="bg-emerald-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">1</span>
                    貼上進貨明細文字
                </h2>
                <div class="space-x-2">
                    <button onclick="loadSampleData()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded border border-gray-300 font-medium transition">
                        <i class="fa-solid fa-vial mr-1"></i>載入範例文字
                    </button>
                </div>
            </div>

            <textarea id="raw-input" rows="7" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm font-mono text-gray-700 bg-gray-50" placeholder="請在此貼上您的進貨文字資訊..."></textarea>

            <div class="mt-3 flex justify-end">
                <button onclick="parseAndBuildItems()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-bold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> 自動解析並帶入計算欄位
                </button>
            </div>
        </section>

        <!-- 第二步：詳細數值微調與計算區 -->
        <section class="bg-white rounded-xl shadow-md p-5 no-print">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 pb-3 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <span class="bg-emerald-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">2</span>
                    品項規格與計算設定（支援自由輸入調整數字）
                </h2>
                <div class="flex items-center gap-2 text-xs text-gray-500">
                    <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-semibold">Tip</span> 修改任何數值，毛利、成本與建議售價將自動即時重新計算
                </div>
            </div>

            <!-- 卡片容器 -->
            <div id="calculator-cards-container" class="space-y-4">
                <div class="text-center py-8 text-gray-400 bg-gray-50 rounded-lg border-2 border-dashed border-gray-200">
                    <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-gray-300"></i>
                    <p>尚未載入品項資料，請於上方貼上明細並點擊「自動解析」</p>
                </div>
            </div>

            <div class="mt-5 pt-3 border-t border-gray-100 flex justify-end">
                <button onclick="applyToSummary()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-bold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-file-import"></i> 一鍵帶入下方摘要區
                </button>
            </div>
        </section>

        <!-- 第三步：摘要區與 PDF 輸出（控制在電腦版 50% 寬度） -->
        <div id="summary-section" class="mx-auto w-full md:w-1/2 transition-all duration-300">
            <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 summary-card">
                
                <!-- 摘要區標頭 -->
                <div class="flex justify-between items-start mb-4 pb-3 border-b-2 border-gray-800">
                    <div>
                        <h3 class="text-xl font-black text-gray-900 tracking-wide uppercase flex items-center gap-2">
                            <i class="fa-solid fa-receipt text-emerald-600 no-print"></i> 進貨與建議售價摘要單
                        </h3>
                        <p class="text-xs text-gray-500 mt-0.5">進貨日期：<span id="summary-date-display" class="font-bold text-gray-800">未設定</span></p>
                    </div>
                    <div class="no-print">
                        <button onclick="window.print()" class="bg-gray-800 hover:bg-gray-900 text-white px-3.5 py-1.5 rounded-md text-xs font-bold shadow transition flex items-center gap-1.5">
                            <i class="fa-solid fa-print"></i> 匯出 PDF / 列印摘要
                        </button>
                    </div>
                </div>

                <!-- 摘要表格 -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs sm:text-sm">
                        <thead>
                            <tr class="bg-gray-100 border-b border-gray-300 text-gray-700 font-bold">
                                <th class="p-2">品名</th>
                                <th class="p-2">規格</th>
                                <th class="p-2 text-center">箱數</th>
                                <th class="p-2 text-right">單位成本</th>
                                <th class="p-2 text-right">建議售價</th>
                            </tr>
                        </thead>
                        <tbody id="summary-table-body" class="divide-y divide-gray-200">
                            <tr>
                                <td colspan="5" class="p-4 text-center text-gray-400 italic">點擊上方「一鍵帶入下方摘要區」生成資料</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 摘要區頁腳資訊 -->
                <div class="mt-6 pt-3 border-t border-gray-200 flex justify-between items-center text-xs text-gray-500">
                    <span>列印日期：<span id="print-timestamp"></span></span>
                    <span class="font-semibold text-gray-700">水果店經營輔助系統</span>
                </div>

            </div>
        </div>

    </div>

    <script>
        // 初始化預設今日日期
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('top-date-picker').value = today;
            updateSummaryDate();

            document.getElementById('top-date-picker').addEventListener('change', updateSummaryDate);
            document.getElementById('print-timestamp').innerText = new Date().toLocaleDateString('zh-TW');
        });

        function updateSummaryDate() {
            const dateVal = document.getElementById('top-date-picker').value;
            document.getElementById('summary-date-display').innerText = dateVal || '未指定日期';
        }

        // 載入範例文字
        function loadSampleData() {
            const sampleText = `📦 【當日進貨與上車明細】

1. 蘋果 (阿龍農產) [🟢已上車 / 已付]
   └ 總箱數: 5箱 | 總額: $5000
   └ 內部數量: 每箱 64顆/箱

2. 芒果 (大發果商) [🟢已上車 / 已付]
   └ 總箱數: 10箱 | 總額: $8300
   └ [特大果] 5箱 (10) @$900
   └ [大果] 3箱 (12) @$800
   └ [中果] 2箱 (15) @$700

3. 台灣葡萄 [🟢已上車 / 已付]
   └ 總箱數: 1箱 | 總額: $1600
   └ 內部數量: 每箱 20斤/箱

4. 甜柿 [🟢已上車 / 已付]
   └ 總箱數: 3箱 | 總額: $3400
   └ [11A] 2箱 () @$1200
   └ [10A] 1箱 () @$1000

5. 日本麝香 [🟢已上車 / 已付]
   └ 總箱數: 7箱 | 總額: $21000
   └ [6串] 2箱 () @$3000
   └ [8串的] 5箱 () @$3000

------------------
📊 總計: 26箱 / $39,300`;
            document.getElementById('raw-input').value = sampleText;
        }

        // 全域資料儲存陣列
        let currentParsedItems = [];

        // 核心文字解析邏輯
        function parseAndBuildItems() {
            const rawText = document.getElementById('raw-input').value;
            if (!rawText.trim()) {
                alert('請先貼上進貨明細文字！');
                return;
            }

            const lines = rawText.split('\n');
            const parsedItems = [];

            let currentParentName = '';
            let currentParentSupplier = '';
            let currentParentTotalBoxes = 0;
            let currentParentTotalAmount = 0;
            let currentParentPerBoxPieces = 0;
            let currentParentPerBoxCatties = 0;
            let currentParentPerBoxBunches = 0;

            let parentSubItems = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line || line.startsWith('📦') || line.startsWith('---') || line.startsWith('📊')) continue;

                // 匹配主要品項，例如：1. 蘋果 (阿龍農產) [🟢已上車 / 已付]
                const mainItemMatch = line.match(/^\d+\.\s*([^\(\[\n]+)(?:\((.*?)\))?/);
                if (mainItemMatch) {
                    // 如果處理到下一個母品項，先存結算前一個母品項
                    if (currentParentName) {
                        finalizeParentGroup(parsedItems, currentParentName, currentParentSupplier, currentParentTotalBoxes, currentParentTotalAmount, currentParentPerBoxPieces, currentParentPerBoxCatties, currentParentPerBoxBunches, parentSubItems);
                    }

                    currentParentName = mainItemMatch[1].trim();
                    currentParentSupplier = mainItemMatch[2] ? mainItemMatch[2].trim() : '';
                    currentParentTotalBoxes = 0;
                    currentParentTotalAmount = 0;
                    currentParentPerBoxPieces = 0;
                    currentParentPerBoxCatties = 0;
                    currentParentPerBoxBunches = 0;
                    parentSubItems = [];
                    continue;
                }

                // 匹配總箱數與總額：└ 總箱數: 5箱 | 總額: $5000
                if (line.includes('總箱數:')) {
                    const boxMatch = line.match(/總箱數:\s*(\d+)箱/);
                    if (boxMatch) currentParentTotalBoxes = parseInt(boxMatch[1], 10);

                    const amtMatch = line.match(/總額:\s*\$?(\d+)/);
                    if (amtMatch) currentParentTotalAmount = parseFloat(amtMatch[1]);
                    continue;
                }

                // 匹配內部數量，例如：└ 內部數量: 每箱 64顆/箱 或 20斤/箱
                if (line.includes('內部數量:')) {
                    const pcsMatch = line.match(/(\d+)\s*顆/);
                    if (pcsMatch) currentParentPerBoxPieces = parseFloat(pcsMatch[1]);

                    const catMatch = line.match(/(\d+)\s*斤/);
                    if (catMatch) currentParentPerBoxCatties = parseFloat(catMatch[1]);

                    const bunMatch = line.match(/(\d+)\s*串/);
                    if (bunMatch) currentParentPerBoxBunches = parseFloat(bunMatch[1]);
                    continue;
                }

                // 匹配子規格，例如：└ [特大果] 5箱 (10) @$900 或 └ [6串] 2箱 () @$3000
                if (line.includes('└') && line.includes('[') && line.includes(']')) {
                    const subSpecMatch = line.match(/\[(.*?)\]/);
                    const subBoxMatch = line.match(/(\d+)\s*箱/);
                    const subBracketCountMatch = line.match(/\((\d+)\)/);
                    const subPriceMatch = line.match(/@\$?(\d+)/);

                    const specName = subSpecMatch ? subSpecMatch[1].trim() : '';
                    const boxes = subBoxMatch ? parseInt(subBoxMatch[1], 10) : 0;
                    const bracketCount = subBracketCountMatch ? parseInt(subBracketCountMatch[1], 10) : 0;
                    const singleBoxPrice = subPriceMatch ? parseFloat(subPriceMatch[1]) : 0;

                    parentSubItems.push({
                        specName,
                        boxes,
                        bracketCount,
                        singleBoxPrice
                    });
                }
            }

            // 處理最後一個品項
            if (currentParentName) {
                finalizeParentGroup(parsedItems, currentParentName, currentParentSupplier, currentParentTotalBoxes, currentParentTotalAmount, currentParentPerBoxPieces, currentParentPerBoxCatties, currentParentPerBoxBunches, parentSubItems);
            }

            currentParsedItems = parsedItems;
            renderCalculatorCards();
            applyToSummary();
        }

        // 將母項目與子規格整合成計算物件
        function finalizeParentGroup(parsedItems, name, supplier, totalBoxes, totalAmount, perBoxPieces, perBoxCatties, perBoxBunches, subItems) {
            const fullName = supplier ? `${name} (${supplier})` : name;

            if (subItems.length === 0) {
                // 無子規格，單一卡片
                const avgPrice = totalBoxes > 0 ? (totalAmount / totalBoxes) : 0;
                parsedItems.push({
                    name: fullName,
                    spec: '標準規格',
                    boxes: totalBoxes,
                    catties: perBoxCatties,
                    pieces: perBoxPieces,
                    bunches: perBoxBunches,
                    tare: 0,
                    lossRatio: 0,
                    lossAmount: 0,
                    singleBoxPrice: avgPrice,
                    targetMargin: 30
                });
            } else {
                // 有多種子規格
                subItems.forEach(sub => {
                    let subPieces = 0;
                    let subBunches = 0;

                    // 判斷 [6串] 或 [8串的]
                    if (sub.specName.includes('串')) {
                        const bMatch = sub.specName.match(/(\d+)\s*串/);
                        if (bMatch) subBunches = parseInt(bMatch[1], 10);
                    } else if (sub.bracketCount > 0) {
                        subPieces = sub.bracketCount;
                    }

                    parsedItems.push({
                        name: fullName,
                        spec: sub.specName,
                        boxes: sub.boxes,
                        catties: perBoxCatties,
                        pieces: subPieces || perBoxPieces,
                        bunches: subBunches || perBoxBunches,
                        tare: 0,
                        lossRatio: 0,
                        lossAmount: 0,
                        singleBoxPrice: sub.singleBoxPrice,
                        targetMargin: 30
                    });
                });
            }
        }

        // 渲染第二步的計算卡片
        function renderCalculatorCards() {
            const container = document.getElementById('calculator-cards-container');
            container.innerHTML = '';

            if (currentParsedItems.length === 0) {
                container.innerHTML = `
                <div class="text-center py-8 text-gray-400 bg-gray-50 rounded-lg border-2 border-dashed border-gray-200">
                    <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-gray-300"></i>
                    <p>尚未解析到任何品項資訊，請確認輸入內容後重新解析</p>
                </div>`;
                return;
            }

            currentParsedItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-slate-50 rounded-lg p-4 border border-gray-200 shadow-sm relative hover:border-emerald-300 transition";

                card.innerHTML = `
                    <div class="flex flex-wrap justify-between items-center pb-2 mb-3 border-b border-gray-200 gap-2">
                        <div class="flex items-center gap-2">
                            <span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded font-bold">品項 #${index + 1}</span>
                            <input type="text" value="${item.name}" onchange="updateItemData(${index}, 'name', this.value)" class="font-bold text-gray-800 bg-transparent border-b border-gray-300 focus:border-emerald-500 focus:bg-white text-base px-1">
                            <input type="text" value="${item.spec}" onchange="updateItemData(${index}, 'spec', this.value)" class="text-xs bg-white text-emerald-700 font-semibold border border-emerald-300 rounded px-2 py-0.5 w-24">
                        </div>
                        <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600 text-xs flex items-center gap-1">
                            <i class="fa-solid fa-xmark"></i> 刪除此項
                        </button>
                    </div>

                    <!-- 自由輸入欄位網格 -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3 text-xs">
                        
                        <div>
                            <label class="block text-gray-600 mb-1 font-medium">箱數</label>
                            <input type="number" step="1" value="${item.boxes}" oninput="updateItemData(${index}, 'boxes', this.value)" class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-500 bg-white font-semibold">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium">台斤/箱</label>
                            <input type="number" step="0.1" value="${item.catties}" oninput="updateItemData(${index}, 'catties', this.value)" class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-500 bg-white">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium">顆數/箱</label>
                            <input type="number" step="1" value="${item.pieces}" oninput="updateItemData(${index}, 'pieces', this.value)" class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-500 bg-white">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium">串數/箱</label>
                            <input type="number" step="1" value="${item.bunches}" oninput="updateItemData(${index}, 'bunches', this.value)" class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-500 bg-white">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium text-amber-700">扣箱重 (斤)</label>
                            <input type="number" step="0.1" value="${item.tare}" oninput="updateItemData(${index}, 'tare', this.value)" class="w-full p-1.5 border border-amber-300 bg-amber-50 rounded focus:ring-1 focus:ring-amber-500">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium text-rose-700">損耗 (%)</label>
                            <input type="number" step="1" value="${item.lossRatio}" oninput="updateItemData(${index}, 'lossRatio', this.value)" class="w-full p-1.5 border border-rose-300 bg-rose-50 rounded focus:ring-1 focus:ring-rose-500 font-semibold text-rose-800">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium text-rose-700">損耗(顆/斤)</label>
                            <input type="number" step="0.1" value="${item.lossAmount}" oninput="updateItemData(${index}, 'lossAmount', this.value)" class="w-full p-1.5 border border-rose-200 rounded focus:ring-1 focus:ring-rose-500">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium text-emerald-800">單箱價錢 ($)</label>
                            <input type="number" step="10" value="${item.singleBoxPrice}" oninput="updateItemData(${index}, 'singleBoxPrice', this.value)" class="w-full p-1.5 border border-emerald-300 bg-emerald-50 rounded focus:ring-1 focus:ring-emerald-500 font-bold text-emerald-900">
                        </div>

                        <div>
                            <label class="block text-gray-600 mb-1 font-medium">預設毛利 (%)</label>
                            <input type="number" step="1" value="${item.targetMargin}" oninput="updateItemData(${index}, 'targetMargin', this.value)" class="w-full p-1.5 border border-gray-300 rounded focus:ring-1 focus:ring-emerald-500 bg-white">
                        </div>

                        <div class="col-span-2 sm:col-span-3 md:col-span-3 bg-white p-2 rounded border border-gray-200 flex items-center justify-around">
                            <div class="text-center">
                                <span class="block text-[10px] text-gray-400">單位淨成本</span>
                                <span class="text-sm font-bold text-slate-700" id="unit-cost-${index}">$0</span>
                                <span class="text-[10px] text-gray-400 block" id="unit-label-${index}">/單位</span>
                            </div>
                            <div class="h-6 w-px bg-gray-200"></div>
                            <div class="text-center">
                                <span class="block text-[10px] text-emerald-600 font-bold">建議售價</span>
                                <span class="text-base font-black text-emerald-700" id="suggested-price-${index}">$0</span>
                            </div>
                        </div>

                    </div>
                `;

                container.appendChild(card);
                calculateItemResult(index);
            });
        }

        // 當使用者修改卡片中的任何數字欄位時
        function updateItemData(index, key, value) {
            const item = currentParsedItems[index];

            if (key === 'name' || key === 'spec') {
                item[key] = value;
            } else {
                item[key] = parseFloat(value) || 0;
            }

            // 特殊連動：當修改損耗%時，自動更新損耗數量（反之亦然）
            if (key === 'lossRatio') {
                const totalUnits = getItemTotalBaseUnits(item);
                item.lossAmount = Math.round((totalUnits * (item.lossRatio / 100)) * 10) / 10;
                // 更新畫面的 lossAmount 輸入框
                const inputs = document.querySelectorAll(`#calculator-cards-container > div`)[index].querySelectorAll('input');
                inputs.forEach(inp => {
                    if (inp.getAttribute('oninput')?.includes('lossAmount')) inp.value = item.lossAmount;
                });
            } else if (key === 'lossAmount') {
                const totalUnits = getItemTotalBaseUnits(item);
                item.lossRatio = totalUnits > 0 ? Math.round((item.lossAmount / totalUnits) * 100) : 0;
                const inputs = document.querySelectorAll(`#calculator-cards-container > div`)[index].querySelectorAll('input');
                inputs.forEach(inp => {
                    if (inp.getAttribute('oninput')?.includes('lossRatio')) inp.value = item.lossRatio;
                });
            }

            calculateItemResult(index);
        }

        // 取得項目基底總單位數 (台斤/顆數/串數/箱)
        function getItemTotalBaseUnits(item) {
            if (item.catties > 0) return Math.max(0, item.catties - item.tare);
            if (item.pieces > 0) return item.pieces;
            if (item.bunches > 0) return item.bunches;
            return 1; // 預設為每箱
        }

        // 計算單一項目的淨成本與建議售價
        function calculateItemResult(index) {
            const item = currentParsedItems[index];

            // 1. 決定單位名稱
            let unitName = '箱';
            let totalBaseUnits = 1;

            if (item.catties > 0) {
                unitName = '斤';
                totalBaseUnits = Math.max(0, item.catties - item.tare);
            } else if (item.pieces > 0) {
                unitName = '顆';
                totalBaseUnits = item.pieces;
            } else if (item.bunches > 0) {
                unitName = '串';
                totalBaseUnits = item.bunches;
            }

            // 2. 扣除損耗後的有效淨單位數
            const netUnits = Math.max(0.1, totalBaseUnits - item.lossAmount);

            // 3. 計算淨成本 (單箱價格 / 有效淨單位數)
            const unitCost = item.singleBoxPrice / netUnits;

            // 4. 計算建議售價 (淨成本 / (1 - 毛利率%))
            const marginRatio = (item.targetMargin || 0) / 100;
            const suggestedPrice = marginRatio < 1 ? (unitCost / (1 - marginRatio)) : unitCost;

            // 暫存計算結果
            item.calculatedUnitCost = Math.round(unitCost * 10) / 10;
            item.calculatedSuggestedPrice = Math.ceil(suggestedPrice); // 售價無條件進位至整數
            item.unitName = unitName;

            // 更新 UI 顯示
            const costEl = document.getElementById(`unit-cost-${index}`);
            const priceEl = document.getElementById(`suggested-price-${index}`);
            const labelEl = document.getElementById(`unit-label-${index}`);

            if (costEl) costEl.innerText = `$${item.calculatedUnitCost}`;
            if (priceEl) priceEl.innerText = `$${item.calculatedSuggestedPrice}`;
            if (labelEl) labelEl.innerText = `/${unitName}`;
        }

        // 刪除特定品項
        function removeItem(index) {
            currentParsedItems.splice(index, 1);
            renderCalculatorCards();
            applyToSummary();
        }

        // 將計算好的結果帶入 50% 寬度摘要區
        function applyToSummary() {
            updateSummaryDate();
            const tbody = document.getElementById('summary-table-body');
            tbody.innerHTML = '';

            if (currentParsedItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400 italic">無品項資料</td></tr>`;
                return;
            }

            currentParsedItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50 transition";

                tr.innerHTML = `
                    <td class="p-2 font-bold text-gray-800">${item.name}</td>
                    <td class="p-2 text-gray-600">${item.spec}</td>
                    <td class="p-2 text-center font-medium">${item.boxes} 箱</td>
                    <td class="p-2 text-right text-gray-600">$${item.calculatedUnitCost || 0} / ${item.unitName || '單位'}</td>
                    <td class="p-2 text-right font-black text-emerald-700 text-base">$${item.calculatedSuggestedPrice || 0} / ${item.unitName || '單位'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 一鍵清空所有資料
        function clearAllData() {
            if (confirm('確定要清空所有資料嗎？這將清除輸入的文字、計算卡片與摘要內容。')) {
                document.getElementById('raw-input').value = '';
                currentParsedItems = [];
                renderCalculatorCards();
                applyToSummary();
            }
        }
    </script>
</body>
</html>
