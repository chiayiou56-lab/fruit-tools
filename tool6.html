<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>實用工具箱 - 綠金雲端同步版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 禁止 iPad / 手機點擊兩下自動放大畫面 */
        * {
            touch-action: manipulation;
        }
    
        .gift-key {
            min-height: 54px;
            border-radius: 14px;
            border: 1px solid #cbd8c9;
            background: #f5f8f3;
            color: #294b35;
            font-size: 1.35rem;
            font-weight: 700;
            box-shadow: 0 2px 0 rgba(41,75,53,.10);
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .gift-key:active {
            background: #dceadd;
            transform: scale(.97);
        }
        .gift-key-action {
            background: #e5eee3;
            font-size: 1rem;
        }
        @media (min-width: 640px) {
            .gift-key { min-height: 58px; }
        }
</style>

    <style>
        :root {
            --page: #f3f5f0;
            --surface: #ffffff;
            --surface-soft: #edf2eb;
            --sage: #66816d;
            --sage-dark: #496451;
            --sage-pale: #e2ebe1;
            --ink: #34443a;
            --muted: #78867b;
            --line: #dce5dc;
        }
        body {
            background: var(--page) !important;
            color: var(--ink) !important;
        }
        header {
            background: rgba(248,250,246,.94) !important;
            border-color: var(--line) !important;
            box-shadow: 0 4px 18px rgba(55,75,59,.07) !important;
        }
        header span, header a { color: var(--sage-dark) !important; }
        header a {
            background: var(--sage-pale) !important;
            border: 1px solid #d5e1d4 !important;
        }
        header a:hover { background: #d5e3d4 !important; }
        section:not(.gift-calculator) {
            background: var(--surface) !important;
            color: var(--ink) !important;
            border: 1px solid var(--line) !important;
            box-shadow: 0 8px 24px rgba(55,75,59,.06) !important;
        }
        section:not(.gift-calculator) h2 { color: var(--sage-dark) !important; }
        section:not(.gift-calculator) p { color: var(--muted) !important; }
        section:not(.gift-calculator) input,
        section:not(.gift-calculator) textarea {
            background: #f7f9f6 !important;
            color: var(--ink) !important;
            border-color: #d8e2d8 !important;
        }
        section:not(.gift-calculator) input::placeholder,
        section:not(.gift-calculator) textarea::placeholder { color: #9aa79b !important; }
        section:not(.gift-calculator) button { box-shadow: none !important; }
        section:not(.gift-calculator) button[class*="bg-gradient-to-r"] {
            background: var(--sage) !important;
            color: white !important;
        }
        section:not(.gift-calculator) button[class*="bg-emerald"],
        section:not(.gift-calculator) button[class*="bg-amber-500/20"] {
            background: var(--surface-soft) !important;
            color: var(--sage-dark) !important;
            border-color: var(--line) !important;
        }
        section:not(.gift-calculator) #calc-display,
        section:not(.gift-calculator) #calc-history {
            color: #f2f6ef !important;
        }
        section:not(.gift-calculator) .bg-emerald-950 {
            background: #526b59 !important;
            border-color: #526b59 !important;
        }
        section:not(.gift-calculator) #todo-list > div {
            background: #e8f1e7 !important;
            border-color: #cbdcc9 !important;
        }
        section:not(.gift-calculator) #todo-list > div span:not(.line-through) {
            color: #32613f !important;
            font-weight: 600;
        }
        section:not(.gift-calculator) #todo-list > div span.line-through {
            color: #8a9b8d !important;
        }
        footer {
            background: #e9eee7 !important;
            border-color: var(--line) !important;
            color: #7b897d !important;
        }
        #custom-modal > div {
            background: white !important;
            color: var(--ink) !important;
            border-color: var(--line) !important;
        }
        #modal-title { color: var(--sage-dark) !important; }
        #modal-message { color: var(--ink) !important; }
        .gift-calculator {
            background: var(--surface) !important;
            color: var(--ink);
            border: 1px solid var(--line);
            box-shadow: 0 8px 24px rgba(55,75,59,.06);
        }
        .gift-calculator h2, .gift-calculator h3 { color: var(--sage-dark); }
        .gift-icon {
            background: var(--sage-pale);
            color: var(--sage-dark);
        }
        .gift-muted { color: var(--muted); }
        .gift-entry { background: #f5f8f4; border: 1px solid var(--line); }
        .gift-input {
            background: white;
            color: var(--ink);
            border: 1px solid #d4dfd4;
            outline: none;
            min-height: 48px;
        }
        .gift-input:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(102,129,109,.14);
        }
        .gift-primary-btn { background: var(--sage); color: white; min-height: 48px; }
        .gift-primary-btn:active, .gift-secondary-btn:active { transform: scale(.98); }
        .gift-secondary-btn { background: var(--surface-soft); color: var(--sage-dark); border: 1px solid var(--line); }
        .gift-count { background: var(--sage-pale); color: var(--sage-dark); }
        .gift-empty { background: #f7f9f6; border: 1px dashed #cbd8cc; color: #879589; }
        .gift-total-card { background: #edf3ec; border: 1px solid #dce7dc; }
        .gift-total-card strong { color: var(--sage-dark); }
        .gift-divider { border-color: #d8e3d8; }
        .gift-tip { background: #f8f6ed; color: #7c795f; }

        .note-action-btn { min-height: 48px; }
        #note-record-list .note-record {
            background: #f4f8f3;
            border: 1px solid #dce7dc;
            border-radius: 14px;
            padding: 13px;
        }
        #note-record-list .note-record-content {
            color: #3d5944;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.65;
        }
        #note-record-list .note-record-time { color: #879589; font-size: 12px; }
        #note-record-list .note-record-delete {
            color: #a36d68; background: #f8eeee;
            border-radius: 10px; width: 38px; height: 38px; flex-shrink: 0;
        }
        #voice-note-btn.is-recording {
            color: #9b4944 !important;
            background: #f9e9e7 !important;
            border-color: #e9c8c4 !important;
        }
        .gift-item {
            background: white;
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 13px 14px;
        }
        .gift-item-name { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
        .gift-item-meta { color: var(--muted); font-size: 13px; }
        .gift-qty-btn {
            width: 38px; height: 38px; border-radius: 11px;
            background: var(--surface-soft); color: var(--sage-dark);
            font-size: 20px; font-weight: 700;
        }
        .gift-qty-value {
            width: 48px; text-align: center; font-weight: 700;
            color: var(--ink); background: transparent; border: 0; outline: none;
        }
        .gift-delete {
            width: 38px; height: 38px; border-radius: 11px;
            color: #a36d68; background: #f8eeee;
        }
        @media (min-width: 768px) and (max-width: 1199px) {
            main { padding-top: 22px !important; }
            main > div { gap: 18px !important; }
            section:not(.gift-calculator) { padding: 20px !important; }
        }
        @media (max-width: 767px) {
            .gift-calculator { padding: 18px !important; }
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        emeraldTheme: {
                            950: '#022c22',
                            900: '#064e3b',
                            800: '#065f46',
                            700: '#047857',
                        },
                        goldTheme: {
                            DEFAULT: '#d97706',
                            light: '#fbbf24',
                            amber: '#f59e0b',
                            dark: '#b45309'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-emerald-950 via-emerald-900 to-teal-950 min-h-screen text-slate-100 font-sans antialiased flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

    <!-- 頂部固定導覽列 (加入 id="top" 作為回首頁錨點) -->
    <header id="top" class="sticky top-0 z-50 backdrop-blur-md bg-emerald-950/85 border-b border-amber-500/30 shadow-lg shadow-emerald-950/50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-amber-500 to-amber-300 text-slate-950 p-2.5 sm:p-3 rounded-2xl shadow-md shadow-amber-500/20 flex items-center justify-center font-bold">
                    <i class="fa-solid fa-gem text-lg sm:text-xl"></i>
                </div>
                <span class="font-bold text-lg sm:text-2xl bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200 bg-clip-text text-transparent tracking-wide">
                    實用工具箱
                </span>
            </div>
            
            <div class="flex items-center space-x-3">
                <!-- 雲端連線狀態指示燈 -->
                <div id="cloud-status" class="hidden sm:flex items-center space-x-2 px-3 py-1.5 bg-emerald-950/85 border border-emerald-800 rounded-xl text-xs font-medium text-emerald-300">
                    <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <span id="status-text">連線中...</span>
                </div>

                <!-- 回首頁 / 連結外部首頁按鈕 -->
                <a href="https://fruit-tools.vercel.app/index.html" class="flex items-center space-x-2 px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-emerald-900/80 hover:bg-amber-500 hover:text-slate-950 text-amber-200 border border-amber-500/30 transition-all font-medium text-sm sm:text-base active:scale-95 shadow-sm cursor-pointer no-underline">
                    <i class="fa-solid fa-house-chimney text-xs sm:text-sm"></i>
                    <span>回首頁</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 flex-grow w-full">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 sm:gap-6">
            
            <!-- 1. 待辦事項區塊 -->
            <section class="bg-emerald-900/60 backdrop-blur-md rounded-3xl p-5 sm:p-7 shadow-2xl shadow-emerald-950/60 border border-amber-500/20 flex flex-col justify-between transition-all hover:border-amber-500/40">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl border border-amber-500/20">
                                <i class="fa-solid fa-list-check text-lg sm:text-xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-base sm:text-lg text-amber-200">待辦事項</h2>
                                <p class="text-xs text-emerald-300/70">雲端同步工作清單</p>
                            </div>
                        </div>
                        <span id="todo-count" class="text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-300 rounded-full border border-amber-500/30">0 項</span>
                    </div>

                    <!-- 區塊獨立清除功能 (置頂) -->
                    <div class="pt-2 pb-4 mb-4 border-b border-emerald-800/60 flex gap-2">
                        <button onclick="clearCompletedTodos()" class="flex-1 py-3 px-3 bg-emerald-950/60 hover:bg-amber-500/20 hover:text-amber-300 text-emerald-200 text-xs sm:text-sm font-medium rounded-xl border border-emerald-800 transition-all flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-check-double text-amber-400"></i> 清除已完成
                        </button>
                        <button onclick="clearAllTodos()" class="flex-1 py-3 px-3 bg-emerald-950/60 hover:bg-rose-500/20 hover:text-rose-300 text-emerald-200 text-xs sm:text-sm font-medium rounded-xl border border-emerald-800 transition-all flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-trash-can text-rose-400"></i> 全部清除
                        </button>
                    </div>

                    <!-- 新增表單 -->
                    <form id="todo-form" class="flex gap-2 mb-5" onsubmit="addTodo(event)">
                        <input type="text" id="todo-input" placeholder="輸入新的待辦事項..." required
                            class="flex-grow px-4 py-3.5 bg-emerald-950/60 border border-emerald-700/60 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-emerald-950 text-sm sm:text-base text-slate-100 placeholder-emerald-400/50 transition-all">
                        <button type="submit" class="px-5 py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-2xl transition-all shadow-md shadow-amber-950 active:scale-95 flex items-center justify-center">
                            <i class="fa-solid fa-plus text-lg"></i>
                        </button>
                    </form>

                    <!-- 列表區 -->
                    <div class="space-y-3 max-h-72 sm:max-h-80 overflow-y-auto pr-1 mb-2" id="todo-list">
                        <!-- 動態插入 -->
                    </div>
                </div>
            </section>

            <!-- 2. 隨手文字筆記區塊 -->
            <section class="bg-emerald-900/60 backdrop-blur-md rounded-3xl p-5 sm:p-7 shadow-2xl shadow-emerald-950/60 border border-amber-500/20 flex flex-col justify-between transition-all hover:border-amber-500/40">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl border border-amber-500/20">
                                <i class="fa-solid fa-note-sticky text-lg sm:text-xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-base sm:text-lg text-amber-200">隨手筆記</h2>
                                <p class="text-xs text-emerald-300/70">雲端即時同步筆記</p>
                            </div>
                        </div>
                        <span id="note-count" class="text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-300 rounded-full border border-amber-500/30">0 字</span>
                    </div>

                    <!-- 區塊獨立清除功能 (置頂) -->
                    <div class="pt-2 pb-4 mb-4 border-b border-emerald-800/60">
                        <button onclick="clearNote()" class="w-full py-3 px-3 bg-emerald-950/60 hover:bg-rose-500/20 hover:text-rose-300 text-emerald-200 text-xs sm:text-sm font-medium rounded-xl border border-emerald-800 transition-all flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-trash-can text-rose-400"></i> 清空筆記內容
                        </button>
                    </div>

                    <div class="mb-3">
                        <textarea id="quick-note" placeholder="在此輸入文字，或使用語音輸入..." rows="6" oninput="handleNoteInput()"
                            class="w-full px-4 py-3.5 bg-emerald-950/60 border border-emerald-700/60 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-emerald-950 text-sm sm:text-base text-slate-100 placeholder-emerald-400/50 transition-all resize-y leading-relaxed"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-5">
                        <button id="voice-note-btn" type="button" onclick="toggleVoiceInput()"
                            class="py-3 px-3 rounded-xl border border-emerald-800 bg-emerald-950/60 text-emerald-200 font-semibold text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-microphone"></i><span>語音輸入</span>
                        </button>
                        <button type="button" onclick="saveNoteRecord()"
                            class="py-3 px-3 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-sm flex items-center justify-center gap-2">
                            <i class="fa-solid fa-bookmark"></i><span>紀錄一筆</span>
                        </button>
                    </div>
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-bold text-sm text-emerald-800">已儲存紀錄</h3>
                        <span id="note-record-count" class="text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">0 筆</span>
                    </div>
                    <div id="note-record-list" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <div class="text-center py-5 text-sm text-slate-400">目前尚無紀錄</div>
                    </div>
                </div>
            </section>

            <!-- 3. 計算機區塊 -->
            <section class="bg-emerald-900/60 backdrop-blur-md rounded-3xl p-5 sm:p-7 shadow-2xl shadow-emerald-950/60 border border-amber-500/20 flex flex-col justify-between transition-all hover:border-amber-500/40 md:col-span-2 lg:col-span-1">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <div class="p-3 bg-amber-500/10 text-amber-400 rounded-2xl border border-amber-500/20">
                                <i class="fa-solid fa-calculator text-lg sm:text-xl"></i>
                            </div>
                            <div>
                                <h2 class="font-bold text-base sm:text-lg text-amber-200">計算機</h2>
                                <p class="text-xs text-emerald-300/70">震動回饋與 PC 鍵盤支援</p>
                            </div>
                        </div>
                    </div>

                    <!-- 區塊獨立清除功能 (置頂) -->
                    <div class="pt-2 pb-4 mb-4 border-b border-emerald-800/60">
                        <button onclick="calcReset()" class="w-full py-3 px-3 bg-emerald-950/60 hover:bg-amber-500/20 hover:text-amber-300 text-emerald-200 text-xs sm:text-sm font-medium rounded-xl border border-emerald-800 transition-all flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-arrows-rotate text-amber-400"></i> 計算機歸零重置
                        </button>
                    </div>
                    <div class="bg-emerald-950 text-amber-300 p-4 sm:p-5 rounded-2xl mb-4 shadow-inner text-right border border-emerald-800">
                        <div id="calc-history" class="text-xs sm:text-sm text-emerald-400/70 h-6 overflow-hidden font-mono"></div>
                        <div id="calc-display" class="text-3xl sm:text-4xl font-bold font-mono tracking-wider truncate mt-1 text-amber-200">0</div>
                    </div>

                    <!-- 計算機按鈕 (iPad 超大觸控面積與震動回饋) -->
                    <div class="grid grid-cols-4 gap-3.5 mb-2">
                        <button onclick="calcClear(event)" class="py-6 sm:py-7 bg-rose-950/70 hover:bg-rose-900 text-rose-300 border border-rose-900/60 rounded-2xl font-bold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">C</button>
                        <button onclick="calcAppend(event, '%')" class="py-6 sm:py-7 bg-emerald-950/80 hover:bg-emerald-800 text-emerald-200 border border-emerald-800 rounded-2xl font-bold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">%</button>
                        <button onclick="calcBackSpace(event)" class="py-6 sm:py-7 bg-emerald-950/80 hover:bg-emerald-800 text-emerald-200 border border-emerald-800 rounded-2xl font-bold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md"><i class="fa-solid fa-delete-left"></i></button>
                        <button onclick="calcAppend(event, '/')" class="py-6 sm:py-7 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 rounded-2xl font-bold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">÷</button>
                        
                        <button onclick="calcAppend(event, '7')" class="py-6 sm:py-7 bg-emerald-950/40 hover:bg-emerald-800 text-slate-100 border border-emerald-800/60 rounded-2xl font-semibold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">7</button>
                        <button onclick="calcAppend(event, '8')" class="py-6 sm:py-7 bg-emerald-950/40 hover:bg-emerald-800 text-slate-100 border border-emerald-800/60 rounded-2xl font-semibold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">8</button>
                        <button onclick="calcAppend(event, '9')" class="py-6 sm:py-7 bg-emerald-950/40 hover:bg-emerald-800 text-slate-100 border border-emerald-800/60 rounded-2xl font-semibold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">9</button>
                        <button onclick="calcAppend(event, '*')" class="py-6 sm:py-7 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 rounded-2xl font-bold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">×</button>
                        
                        <button onclick="calcAppend(event, '4')" class="py-6 sm:py-7 bg-emerald-950/40 hover:bg-emerald-800 text-slate-100 border border-emerald-800/60 rounded-2xl font-semibold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">4</button>
                        <button onclick="calcAppend(event, '5')" class="py-6 sm:py-7 bg-emerald-950/40 hover:bg-emerald-800 text-slate-100 border border-emerald-800/60 rounded-2xl font-semibold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">5</button>
                        <button onclick="calcAppend(event, '6')" class="py-6 sm:py-7 bg-emerald-950/40 hover:bg-emerald-800 text-slate-100 border border-emerald-800/60 rounded-2xl font-semibold transition-all active:scale-95 text-2xl sm:text-3xl flex items-center justify-center shadow-md">6</button>

    <div id="custom-modal" class="fixed inset-0 bg-emerald-950/80 backdrop-blur-xs flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">

    <!-- Firebase 腳本與應用程式邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC--ACJtcLYPDukAiUFb5Ew1KLacynti7g",
            authDomain: "fir-config-276df.firebaseapp.com",
            projectId: "fir-config-276df",
            storageBucket: "fir-config-276df.appspot.com",
            messagingSenderId: "668262487593",
            appId: "1:668262487593:web:4469c185f7c625cde12e38",
            measurementId: "G-S32FYB9P9J",
            databaseURL: "https://fir-config-276df-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        function updateCloudStatus(state, msg) {
            if (!statusDot || !statusText) return;
            if (state === 'connected') {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400";
                statusText.innerText = msg || "雲端已連線";
            } else if (state === 'connecting') {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";
                statusText.innerText = msg || "連線中...";
            } else {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                statusText.innerText = msg || "離線模式";
            }
        }

        const rawAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-toolbox-app';
        const sanitizedAppId = String(rawAppId).replace(/[.#$\[\]]/g, '_');
        const dbRef = ref(database, `artifacts/${sanitizedAppId}/public/data/toolbox`);

        let todos = [];
        let quickNoteContent = '';
        let noteRecords = [];
        let voiceRecognition = null;
        let isLocalSyncing = false;

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.todos) {
                    todos = Array.isArray(data.todos) ? data.todos : Object.values(data.todos);
                } else {
                    todos = [];
                }
                if (data.note !== undefined && !isLocalSyncing) {
                    quickNoteContent = data.note;
                    const textarea = document.getElementById('quick-note');
                    if (textarea && textarea.value !== quickNoteContent) {
                        textarea.value = quickNoteContent;
                        updateNoteCount(quickNoteContent);
                    }
                }
                noteRecords = Array.isArray(data.noteRecords) ? data.noteRecords : [];
                renderNoteRecords();
                renderTodos();
                updateCloudStatus('connected', '雲端同步就緒');
            } else {
                syncToCloud();
            }
        }, (error) => {
            console.error(error);
            updateCloudStatus('offline', '雲端離線');
        });

        function syncToCloud() {
            set(dbRef, {
                todos: todos,
                note: quickNoteContent,
                noteRecords: noteRecords,
                updatedAt: Date.now()
            }).then(() => {
                updateCloudStatus('connected', '雲端已連線');
            }).catch(() => {
                updateCloudStatus('offline', '連線異常');
            });
        }

        window.showMessage = function(title, message, type = 'info') {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-content-box');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const iconWrap = document.getElementById('modal-icon-wrap');
            if (type === 'error') {
                iconWrap.className = "w-10 h-10 rounded-2xl bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-center justify-center font-bold";
                iconWrap.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
            } else {
                iconWrap.className = "w-10 h-10 rounded-2xl bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center justify-center font-bold";
                iconWrap.innerHTML = '<i class="fa-solid fa-bell"></i>';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                box.classList.remove('scale-95');
                box.classList.add('scale-100');
            }, 10);
        };

        window.closeModal = function() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-content-box');
            modal.classList.add('opacity-0');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        };

        function triggerVibration() {
            if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
                try {
                    navigator.vibrate([25]);
                } catch (e) {
                    console.log('Vibration not supported or blocked', e);
                }
            }
        }

        window.addTodo = function(e) {
            e.preventDefault();
            triggerVibration();
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;

            todos.unshift({ id: Date.now(), text: text, completed: false });
            input.value = '';
            syncToCloud();
        };

        window.toggleTodo = function(id) {
            triggerVibration();
            todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            syncToCloud();
        };

        window.deleteTodo = function(id) {
            triggerVibration();
            todos = todos.filter(t => t.id !== id);
            syncToCloud();
        };

        window.clearCompletedTodos = function() {
            triggerVibration();
            const initialCount = todos.length;
            todos = todos.filter(t => !t.completed);
            if (todos.length === initialCount) {
                window.showMessage('提示', '目前沒有已完成的項目可清除。');
                return;
            }
            syncToCloud();
        };

        window.clearAllTodos = function() {
            triggerVibration();
            if (todos.length === 0) {
                window.showMessage('提示', '待辦清單已經是空的了。');
                return;
            }
            todos = [];
            syncToCloud();
            window.showMessage('提示', '已全部清除待辦事項。');
        };

        function renderTodos() {
            const listEl = document.getElementById('todo-list');
            const countEl = document.getElementById('todo-count');
            if (!listEl || !countEl) return;
            countEl.innerText = `${todos.length} 項`;

            if (todos.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 text-emerald-300/50 text-sm">
                        <i class="fa-regular fa-clipboard text-3xl mb-2 block text-emerald-400/40"></i>
                        目前沒有待辦事項，新增一個開始吧！
                    </div>
                `;
                return;
            }

            listEl.innerHTML = todos.map(t => `
                <div class="flex items-center justify-between p-3.5 bg-emerald-950/40 hover:bg-emerald-950/70 rounded-2xl border border-emerald-800/60 transition-all group">
                    <div class="flex items-center space-x-3 flex-grow min-w-0 mr-2">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="toggleTodo(${t.id})"
                            class="w-5 h-5 text-amber-500 rounded focus:ring-amber-400 border-emerald-700 bg-emerald-950 cursor-pointer">
                        <span class="text-sm sm:text-base truncate ${t.completed ? 'line-through text-emerald-400/50' : 'text-slate-100'}">${escapeHtml(t.text)}</span>
                    </div>
                    <button onclick="deleteTodo(${t.id})" class="text-emerald-400/60 hover:text-rose-400 p-2 transition-colors opacity-90 sm:opacity-0 group-hover:opacity-100">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            `).join('');
        }

        window.handleNoteInput = function() {
            const textarea = document.getElementById('quick-note');
            quickNoteContent = textarea.value;
            updateNoteCount(quickNoteContent);
            isLocalSyncing = true;
            syncToCloud();
            setTimeout(() => { isLocalSyncing = false; }, 500);
        };


        // 將目前輸入框內容存成獨立紀錄；紀錄會透過原本 Firebase 路徑同步。
        window.saveNoteRecord = function() {
            const textarea = document.getElementById('quick-note');
            const content = textarea.value.trim();
            if (!content) {
                window.showMessage('尚無內容', '請先輸入文字或使用語音輸入，再按「紀錄一筆」。', 'error');
                textarea.focus();
                return;
            }
            noteRecords.unshift({
                id: Date.now() + Math.floor(Math.random() * 1000),
                content,
                createdAt: Date.now()
            });
            textarea.value = '';
            quickNoteContent = '';
            updateNoteCount('');
            renderNoteRecords();
            syncToCloud();
            triggerVibration();
            window.showMessage('已儲存', '這筆筆記已加入紀錄清單。');
        };

        window.deleteNoteRecord = function(id) {
            noteRecords = noteRecords.filter(record => String(record.id) !== String(id));
            renderNoteRecords();
            syncToCloud();
            triggerVibration();
        };

        function renderNoteRecords() {
            const list = document.getElementById('note-record-list');
            const count = document.getElementById('note-record-count');
            if (!list || !count) return;
            count.textContent = `${noteRecords.length} 筆`;
            if (!noteRecords.length) {
                list.innerHTML = '<div class="text-center py-5 text-sm text-slate-400">目前尚無紀錄</div>';
                return;
            }
            list.innerHTML = noteRecords.map(record => {
                const date = new Date(record.createdAt || Date.now());
                const timeText = date.toLocaleString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
                return `<div class="note-record flex items-start gap-3">
                    <div class="min-w-0 flex-1">
                        <div class="note-record-content">${escapeHtml(String(record.content || ''))}</div>
                        <div class="note-record-time mt-2">${timeText}</div>
                    </div>
                    <button type="button" class="note-record-delete" aria-label="刪除此筆紀錄" onclick="deleteNoteRecord('${String(record.id).replace(/'/g, '')}')">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>`;
            }).join('');
        }

        // iPad Safari / 支援 Web Speech API 的瀏覽器可直接語音轉文字。
        window.toggleVoiceInput = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const button = document.getElementById('voice-note-btn');
            if (!SpeechRecognition) {
                window.showMessage('目前瀏覽器不支援', '此瀏覽器未提供語音辨識功能。請改用支援語音輸入的瀏覽器，或使用 iPad 鍵盤上的麥克風聽寫。', 'error');
                return;
            }

            if (voiceRecognition) {
                voiceRecognition.stop();
                return;
            }

            const recognition = new SpeechRecognition();
            voiceRecognition = recognition;
            recognition.lang = 'zh-TW';
            recognition.continuous = true;
            recognition.interimResults = true;
            let finalText = '';
            const textarea = document.getElementById('quick-note');
            const originalText = textarea.value;
            button.classList.add('is-recording');
            button.innerHTML = '<i class="fa-solid fa-stop"></i><span>停止語音</span>';

            recognition.onresult = event => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) finalText += transcript;
                    else interim += transcript;
                }
                textarea.value = originalText + (originalText && (finalText || interim) ? '\n' : '') + finalText + interim;
                handleNoteInput();
            };
            recognition.onerror = event => {
                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    window.showMessage('語音輸入提醒', '語音辨識發生問題，請確認麥克風權限後再試一次。', 'error');
                }
            };
            recognition.onend = () => {
                if (voiceRecognition === recognition) voiceRecognition = null;
                button.classList.remove('is-recording');
                button.innerHTML = '<i class="fa-solid fa-microphone"></i><span>語音輸入</span>';
                handleNoteInput();
            };
            try {
                recognition.start();
            } catch (error) {
                voiceRecognition = null;
                button.classList.remove('is-recording');
                button.innerHTML = '<i class="fa-solid fa-microphone"></i><span>語音輸入</span>';
                window.showMessage('無法啟動語音輸入', '請確認網站使用 HTTPS，並允許瀏覽器使用麥克風。', 'error');
            }
        };

        function updateNoteCount(text) {
            const countEl = document.getElementById('note-count');
            if (countEl) countEl.innerText = `${text.length} 字`;
        }

        window.clearNote = function() {
            triggerVibration();
            const textarea = document.getElementById('quick-note');
            if (!textarea.value.trim()) {
                window.showMessage('提示', '筆記內容已經是空的了。');
                return;
            }
            textarea.value = '';
            quickNoteContent = '';
            updateNoteCount('');
            syncToCloud();
            window.showMessage('提示', '筆記內容已清空。');
        };

        let calcInput = '0';
        let calcHistoryStr = '';

        function updateCalcDisplay() {
            const display = document.getElementById('calc-display');
            const history = document.getElementById('calc-history');
            if (display) display.innerText = calcInput;
            if (history) history.innerText = calcHistoryStr;
        }

        window.calcAppend = function(e, val) {
            if (e) e.preventDefault();
            triggerVibration();
            if (calcInput === '0' && !['+', '-', '*', '/', '%', '.'].includes(val)) {
                calcInput = val;
            } else {
                calcInput += val;
            }
            updateCalcDisplay();
        };

        window.calcClear = function(e) {
            if (e) e.preventDefault();
            triggerVibration();
            calcInput = '0';
            calcHistoryStr = '';
            updateCalcDisplay();
        };

        window.calcReset = function() {
            triggerVibration();
            window.calcClear();
        };

        window.calcBackSpace = function(e) {
            if (e) e.preventDefault();
            triggerVibration();
            if (calcInput.length > 1) {
                calcInput = calcInput.slice(0, -1);
            } else {
                calcInput = '0';
            }
            updateCalcDisplay();
        };

        window.calcCompute = function(e) {
            if (e) e.preventDefault();
            triggerVibration();
            try {
                let expression = calcInput.replace(/×/g, '*').replace(/÷/g, '/');
                expression = expression.replace(/%$/g, '/100');
                
                let result = eval(expression);
                if (!Number.isInteger(result)) {
                    result = parseFloat(result.toFixed(6));
                }
                calcHistoryStr = calcInput + ' =';
                calcInput = String(result);
                updateCalcDisplay();
            } catch (error) {
                window.showMessage('計算錯誤', '請檢查您輸入的算式是否正確。', 'error');
                calcInput = '0';
                updateCalcDisplay();
            }
        };

        window.addEventListener('keydown', function(e) {
            const activeTag = document.activeElement.tagName;
            if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                window.calcAppend(null, e.key);
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                window.calcAppend(null, e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                window.calcCompute(null);
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                window.calcBackSpace(null);
            } else if (e.key.toLowerCase() === 'c' || e.key === 'Escape') {
                window.calcClear(null);
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }


        // 現組禮盒計價：資料只保留在目前頁面，不影響既有雲端待辦與筆記同步。
        let giftItems = [];
        let nextGiftId = 1;

        // 禮盒單價專用數字鍵：不呼叫系統鍵盤，直接將數字寫入單價欄位。
        window.giftPriceKey = function(key) {
            const priceEl = document.getElementById('gift-price');
            if (!priceEl) return;
            let value = priceEl.value || '';
            if (key === 'clear') value = '';
            else if (key === 'backspace') value = value.slice(0, -1);
            else if (/^\\d$/.test(key)) value += key;
            priceEl.value = value;
            triggerVibration();
        };

        window.addGiftItem = function() {
            const nameEl = document.getElementById('gift-name');
            const priceEl = document.getElementById('gift-price');
            const qtyEl = document.getElementById('gift-qty');
            const name = nameEl.value.trim();
            const price = Number(priceEl.value);
            const qty = Math.floor(Number(qtyEl.value));

            const displayName = name || '未命名商品';
            if (priceEl.value === '' || !Number.isFinite(price) || price < 0) {
                window.showMessage('單價有誤', '請輸入有效的單價（不可小於 0）。', 'error');
                priceEl.focus();
                return;
            }
            if (!Number.isFinite(qty) || qty < 1) {
                window.showMessage('數量有誤', '數量請輸入至少 1 件。', 'error');
                qtyEl.focus();
                return;
            }

            // 相同名稱、相同單價視為同一品項，直接累加數量。
            const existing = name ? giftItems.find(item => item.name === displayName && item.price === price) : null;
            if (existing) existing.qty += qty;
            else giftItems.push({ id: nextGiftId++, name: displayName, price, qty });

            nameEl.value = '';
            priceEl.value = '';
            qtyEl.value = '1';
            nameEl.focus();
            triggerVibration();
            renderGiftItems();
        };

        window.changeGiftQty = function(id, delta) {
            const item = giftItems.find(entry => entry.id === id);
            if (!item) return;
            item.qty = Math.max(1, item.qty + delta);
            triggerVibration();
            renderGiftItems();
        };

        window.setGiftQty = function(id, value) {
            const item = giftItems.find(entry => entry.id === id);
            if (!item) return;
            const qty = Math.floor(Number(value));
            if (!Number.isFinite(qty) || qty < 1) {
                renderGiftItems();
                return;
            }
            item.qty = qty;
            renderGiftItems();
        };

        window.deleteGiftItem = function(id) {
            giftItems = giftItems.filter(item => item.id !== id);
            triggerVibration();
            renderGiftItems();
        };

        window.resetGiftItems = function() {
            if (giftItems.length && !confirm('確定清空目前禮盒的所有品項嗎？')) return;
            giftItems = [];
            renderGiftItems();
        };

        function renderGiftItems() {
            const list = document.getElementById('gift-list');
            const totalEl = document.getElementById('gift-total');
            const countEl = document.getElementById('gift-item-count');
            const kindEl = document.getElementById('gift-kind-total');
            const qtyTotalEl = document.getElementById('gift-qty-total');
            if (!list) return;

            const total = giftItems.reduce((sum, item) => sum + item.price * item.qty, 0);
            const qtyTotal = giftItems.reduce((sum, item) => sum + item.qty, 0);
            totalEl.textContent = total.toLocaleString('zh-TW');
            countEl.textContent = `${giftItems.length} 項`;
            kindEl.textContent = `${giftItems.length} 種`;
            qtyTotalEl.textContent = `${qtyTotal} 件`;

            if (!giftItems.length) {
                list.innerHTML = `<div class="gift-empty rounded-2xl p-7 text-center">
                    <i class="fa-solid fa-basket-shopping text-3xl mb-2"></i>
                    <p>尚未加入品項，從上方輸入開始組盒</p>
                </div>`;
                return;
            }

            list.innerHTML = giftItems.map(item => `
                <div class="gift-item">
                    <div class="flex items-center justify-between gap-3">
                        <div class="min-w-0 flex-1">
                            <div class="gift-item-name">${escapeHtml(item.name)}</div>
                            <div class="gift-item-meta mt-1">$${item.price.toLocaleString('zh-TW')} × ${item.qty}　=　<strong class="text-base" style="color:#496451">$${(item.price * item.qty).toLocaleString('zh-TW')}</strong></div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <button type="button" class="gift-qty-btn" aria-label="減少數量" onclick="changeGiftQty(${item.id}, -1)">−</button>
                            <input class="gift-qty-value" aria-label="品項數量" type="number" min="1" step="1" inputmode="numeric"
                                value="${item.qty}" onchange="setGiftQty(${item.id}, this.value)">
                            <button type="button" class="gift-qty-btn" aria-label="增加數量" onclick="changeGiftQty(${item.id}, 1)">+</button>
                        </div>
                        <button type="button" class="gift-delete shrink-0" aria-label="刪除品項" onclick="deleteGiftItem(${item.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const priceInput = document.getElementById('gift-price');
            const nameInput = document.getElementById('gift-name');
            [nameInput, priceInput].forEach(input => input.addEventListener('keydown', event => {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    window.addGiftItem();
                }
            }));
        });


        window.onload = function() {
            updateCalcDisplay();
            renderGiftItems();
            renderNoteRecords();
        };
    </script>
</body>
</html>
