<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜蜜水果金額顯示助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
        }
        .touch-btn:active {
            transform: scale(0.96);
        }
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-screen overflow-hidden flex flex-col">

    <!-- 主控台畫面 (Control View) -->
    <div id="controlView" class="flex-1 flex flex-col h-full p-3 md:p-5 max-w-7xl mx-auto w-full overflow-hidden">
        <!-- 頂部標題列 -->
        <header class="flex items-center justify-between mb-3 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex-none">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-md shadow-amber-200">
                    🍈
                </div>
                <div>
                    <h1 class="text-base md:text-lg font-bold text-slate-900">甜蜜蜜水果 結帳與顯示系統</h1>
                    <p class="text-xs text-amber-600 font-medium">iPad Mini 專用老闆快速輸入模式</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="clearAll()" class="px-3.5 py-2 bg-rose-50 text-rose-600 rounded-xl font-semibold text-xs md:text-sm hover:bg-rose-100 transition touch-btn">
                    全部重設
                </button>
            </div>
        </header>

        <!-- 雙欄主版面：左側計算輸入，右側今日交易明細 -->
        <div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-3.5 overflow-hidden">
            
            <!-- 左側：輸入與計算器區 (7欄) -->
            <div class="md:col-span-7 flex flex-col h-full space-y-3 overflow-hidden">
                <!-- 當前輸入顯示框 -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between flex-none">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">目前輸入 / 計算金額</span>
                        <span id="subExpression" class="text-xs text-slate-400 font-medium truncate max-w-[200px]"></span>
                    </div>
                    <div class="flex items-baseline justify-between">
                        <div class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight">
                            NT$ <span id="displayAmount">0</span>
                        </div>
                    </div>
                </div>

                <!-- 數字鍵盤區 -->
                <div class="flex-1 grid grid-cols-4 gap-2.5 bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100">
                    <button onclick="appendNum('7')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">7</button>
                    <button onclick="appendNum('8')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">8</button>
                    <button onclick="appendNum('9')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">9</button>
                    <button onclick="backspace()" class="bg-amber-50 hover:bg-amber-100 active:bg-amber-200 text-amber-700 rounded-xl flex items-center justify-center touch-btn shadow-sm font-semibold text-sm">
                        ⌫ 刪除
                    </button>

                    <button onclick="appendNum('4')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">4</button>
                    <button onclick="appendNum('5')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">5</button>
                    <button onclick="appendNum('6')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">6</button>
                    <button onclick="appendOperator('+')" class="bg-emerald-50 hover:bg-emerald-100 active:bg-emerald-200 text-emerald-700 text-xl font-bold rounded-xl flex items-center justify-center touch-btn shadow-sm">＋</button>

                    <button onclick="appendNum('1')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">1</button>
                    <button onclick="appendNum('2')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">2</button>
                    <button onclick="appendNum('3')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">3</button>
                    <button onclick="calculateTotal()" class="row-span-2 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white text-lg font-bold rounded-xl flex items-center justify-center touch-btn shadow-md shadow-amber-200">
                        計 算<br>=
                    </button>

                    <button onclick="appendNum('0')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">0</button>
                    <button onclick="appendNum('00')" class="bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xl font-bold rounded-xl text-slate-700 flex items-center justify-center touch-btn shadow-sm">00</button>
                    <button onclick="clearCurrentEntry()" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 font-semibold rounded-xl flex items-center justify-center touch-btn shadow-sm text-xs">C</button>
                </div>

                <!-- 確認全螢幕顯示按鈕 -->
                <button onclick="confirmAndShow()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl p-3.5 font-bold text-base md:text-lg shadow-lg shadow-amber-200 hover:from-amber-600 hover:to-orange-600 transition flex items-center justify-center space-x-2 touch-btn flex-none">
                    <span>確認並全螢幕顯示今日金額</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>

            <!-- 右側：今日交易紀錄與明細 (5欄) -->
            <div class="md:col-span-5 bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full overflow-hidden">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100 flex-none">
                    <div>
                        <h2 class="font-bold text-slate-800 text-sm md:text-base">📋 今日交易紀錄與明細</h2>
                        <p class="text-xs text-slate-400">已記錄的結帳金額清單</p>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-400 font-medium">今日總累計</div>
                        <div class="text-lg font-black text-amber-600">NT$ <span id="todayTotalDisplay">0</span></div>
                    </div>
                </div>

                <!-- 紀錄清單 -->
                <div id="transactionList" class="flex-1 overflow-y-auto py-2 space-y-2">
                    <div id="emptyTip" class="text-center py-12 text-slate-300 text-sm">
                        尚無交易紀錄，請輸入金額並點擊確認
                    </div>
                </div>

                <!-- 底部快捷紀錄按鈕 -->
                <div class="pt-2 border-t border-slate-100 flex-none">
                    <button onclick="recordCurrentAmount()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs md:text-sm transition touch-btn flex items-center justify-center space-x-1">
                        <span>＋ 記錄目前金額至明細中（不全螢幕）</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 客戶端全螢幕顯示畫面 (Customer Fullscreen Display View) -->
    <div id="customerView" class="fixed inset-0 bg-white z-50 hidden flex flex-col justify-between items-center p-6 md:p-12 text-center cursor-pointer" onclick="returnToControl()">
        <!-- 頂端提示 -->
        <div class="pt-4">
            <span class="inline-block px-5 py-2 bg-amber-50 text-amber-800 font-bold rounded-full text-base md:text-lg border border-amber-200 shadow-sm">
                🍈 甜蜜蜜水果 歡迎光臨
            </span>
        </div>

        <!-- 巨大金額呈現 -->
        <div class="my-auto w-full max-w-5xl px-4">
            <div class="text-2xl md:text-4xl font-bold text-slate-400 mb-3 tracking-wide">今日金額一共是</div>
            <div class="text-6xl sm:text-8xl md:text-9xl font-black text-amber-600 tracking-tight drop-shadow-sm flex items-center justify-center flex-wrap gap-2">
                <span>NT$</span>
                <span id="customerAmountDisplay">0</span>
                <span class="text-4xl sm:text-6xl md:text-7xl font-bold text-slate-800 ml-2">元</span>
            </div>
        </div>

        <!-- 底部返回按鈕提示 -->
        <div class="pb-4">
            <div class="inline-flex items-center space-x-2 text-slate-400 text-sm md:text-base bg-slate-50 px-5 py-2.5 rounded-full border border-slate-200 shadow-sm">
                <svg class="w-5 h-5 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                <span>點擊畫面任意處即可返回修改金額</span>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        let currentInput = "0";
        let expression = "";
        let transactions = [];

        function updateDisplay() {
            document.getElementById("displayAmount").innerText = Number(currentInput).toLocaleString();
            document.getElementById("subExpression").innerText = expression;
        }

        function appendNum(num) {
            if (currentInput === "0" && num !== "00") {
                currentInput = num;
            } else {
                if (currentInput.length < 9) {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === "" && expression === "") return;
            if (currentInput !== "") {
                expression += currentInput + " " + op + " ";
                currentInput = "";
            } else if (expression.length > 0) {
                expression = expression.trim().slice(0, -1) + " " + op + " ";
            }
            updateDisplay();
        }

        function calculateTotal() {
            if (expression === "" && currentInput === "") return;
            try {
                let fullExpr = expression + currentInput;
                let result = eval(fullExpr.replace(/[^0-9+\-*/.]/g, ''));
                if (isNaN(result) || !isFinite(result)) {
                    result = 0;
                }
                currentInput = Math.max(0, Math.round(result)).toString();
                expression = "";
                updateDisplay();
            } catch (e) {
                currentInput = "0";
                expression = "";
                updateDisplay();
            }
        }

        function clearCurrentEntry() {
            currentInput = "0";
            updateDisplay();
        }

        function clearAll() {
            if (confirm("確定要清除所有今日明細與目前輸入嗎？")) {
                currentInput = "0";
                expression = "";
                transactions = [];
                updateDisplay();
                renderTransactions();
            }
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function getCalculatedValue() {
            if (expression !== "") {
                calculateTotal();
            }
            return parseInt(currentInput) || 0;
        }

        function recordCurrentAmount() {
            let val = getCalculatedValue();
            if (val <= 0) return;

            let now = new Date();
            let timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                          now.getMinutes().toString().padStart(2, '0') + ':' + 
                          now.getSeconds().toString().padStart(2, '0');

            transactions.unshift({
                id: Date.now(),
                amount: val,
                time: timeStr
            });

            currentInput = "0";
            expression = "";
            updateDisplay();
            renderTransactions();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            renderTransactions();
        }

        function renderTransactions() {
            const listEl = document.getElementById("transactionList");
            const emptyTip = document.getElementById("emptyTip");
            const totalDisplay = document.getElementById("todayTotalDisplay");

            let totalSum = transactions.reduce((sum, t) => sum + t.amount, 0);
            totalDisplay.innerText = totalSum.toLocaleString();

            if (transactions.length === 0) {
                listEl.innerHTML = `<div id="emptyTip" class="text-center py-12 text-slate-300 text-sm">尚無交易紀錄，請輸入金額並點擊確認</div>`;
                return;
            }

            let html = "";
            transactions.forEach((t, index) => {
                let seq = transactions.length - index;
                html += `
                    <div class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-100 transition">
                        <div class="flex items-center space-x-2.5">
                            <span class="w-6 h-6 rounded-lg bg-amber-100 text-amber-800 text-xs font-bold flex items-center justify-center">${seq}</span>
                            <div>
                                <div class="text-xs text-slate-400">${t.time}</div>
                                <div class="text-sm font-bold text-slate-800">NT$ ${t.amount.toLocaleString()}</div>
                            </div>
                        </div>
                        <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-600 p-1 rounded-lg transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function confirmAndShow() {
            let val = getCalculatedValue();
            if (val > 0) {
                // 自動記錄到明細中
                let now = new Date();
                let timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                              now.getMinutes().toString().padStart(2, '0') + ':' + 
                              now.getSeconds().toString().padStart(2, '0');

                transactions.unshift({
                    id: Date.now(),
                    amount: val,
                    time: timeStr
                });
                renderTransactions();
            }

            // 顯示今日累計金額總和於全螢幕
            let totalSum = transactions.reduce((sum, t) => sum + t.amount, 0);
            document.getElementById("customerAmountDisplay").innerText = totalSum.toLocaleString();
            document.getElementById("customerView").classList.remove("hidden");

            currentInput = "0";
            expression = "";
            updateDisplay();
        }

        function returnToControl() {
            document.getElementById("customerView").classList.add("hidden");
        }
    </script>
</body>
</html>
```
