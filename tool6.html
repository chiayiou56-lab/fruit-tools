<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜蜜水果金額顯示助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            user-select: none;
        }
        .touch-btn:active {
            transform: scale(0.97);
        }
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen w-screen overflow-hidden flex flex-col">

    <!-- 主控台畫面 (Control View) -->
    <div id="controlView" class="flex-1 flex flex-col h-full p-4 md:p-6 max-w-7xl mx-auto w-full overflow-hidden">
        <!-- 頂部標題列 -->
        <header class="flex flex-wrap items-center justify-between mb-4 bg-white p-4.5 rounded-2xl shadow-sm border border-slate-200/60 flex-none gap-3">
            <div class="flex items-center space-x-3.5">
                <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-amber-200">
                    🍈
                </div>
                <div>
                    <h1 class="text-lg md:text-xl font-black text-slate-900">甜蜜蜜水果 結帳與顯示系統</h1>
                    <p class="text-sm text-amber-700 font-semibold">iPad 專用放大版老闆快速輸入模式</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <!-- 拔智齒公告按鈕 -->
                <button onclick="showWisdomToothNotice()" class="px-4 py-2.5 bg-sky-500 hover:bg-sky-600 active:bg-sky-700 text-white rounded-xl font-bold text-sm md:text-base shadow-md shadow-sky-200 transition touch-btn flex items-center space-x-1.5">
                    <span>🦷</span>
                    <span>今日拔智齒不方便說話，請多多見諒</span>
                </button>
                <!-- 全部重設按鈕 -->
                <button onclick="openResetModal()" class="px-5 py-2.5 bg-rose-100 hover:bg-rose-200 active:bg-rose-300 text-rose-700 rounded-xl font-bold text-sm md:text-base transition touch-btn shadow-sm">
                    全部重設
                </button>
            </div>
        </header>

        <!-- 雙欄主版面：左側計算輸入，右側今日交易明細 -->
        <div class="flex-1 grid grid-cols-1 md:grid-cols-12 gap-4 overflow-hidden">
            
            <!-- 左側：輸入與計算器區 (7欄) -->
            <div class="md:col-span-7 flex flex-col h-full space-y-4 overflow-hidden">
                <!-- 當前輸入顯示框 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60 flex flex-col justify-between flex-none">
                    <div class="flex justify-between items-center mb-1.5">
                        <span class="text-sm text-slate-400 font-bold uppercase tracking-wider">目前輸入 / 計算金額</span>
                        <span id="subExpression" class="text-sm text-slate-400 font-semibold truncate max-w-[280px]"></span>
                    </div>
                    <div class="flex items-baseline justify-between">
                        <div class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">
                            NT$ <span id="displayAmount">0</span>
                        </div>
                    </div>
                </div>

                <!-- 數字鍵盤區 (字體與按鈕全面放大) -->
                <div class="flex-1 grid grid-cols-4 gap-3 bg-white p-4.5 rounded-2xl shadow-sm border border-slate-200/60">
                    <button onclick="appendNum('7')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">7</button>
                    <button onclick="appendNum('8')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">8</button>
                    <button onclick="appendNum('9')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">9</button>
                    <button onclick="backspace()" class="bg-amber-100 hover:bg-amber-200 active:bg-amber-300 text-amber-900 rounded-2xl flex items-center justify-center touch-btn shadow-sm font-bold text-base">
                        ⌫ 刪除
                    </button>

                    <button onclick="appendNum('4')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">4</button>
                    <button onclick="appendNum('5')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">5</button>
                    <button onclick="appendNum('6')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">6</button>
                    <button onclick="appendOperator('+')" class="bg-emerald-100 hover:bg-emerald-200 active:bg-emerald-300 text-emerald-800 text-2xl font-black rounded-2xl flex items-center justify-center touch-btn shadow-sm">＋</button>

                    <button onclick="appendNum('1')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">1</button>
                    <button onclick="appendNum('2')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">2</button>
                    <button onclick="appendNum('3')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">3</button>
                    <button onclick="calculateTotal()" class="row-span-2 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white text-xl font-black rounded-2xl flex flex-col items-center justify-center touch-btn shadow-md shadow-amber-300">
                        <span>計 算</span>
                        <span class="text-2xl">=</span>
                    </button>

                    <button onclick="appendNum('0')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">0</button>
                    <button onclick="appendNum('00')" class="bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-2xl font-black rounded-2xl text-slate-800 flex items-center justify-center touch-btn shadow-sm">00</button>
                    <button onclick="clearCurrentEntry()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold rounded-2xl flex items-center justify-center touch-btn shadow-sm text-sm">清除 (C)</button>
                </div>

                <!-- 確認全螢幕顯示按鈕 -->
                <button onclick="confirmAndShow()" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl p-4 font-black text-lg md:text-xl shadow-lg shadow-amber-200 hover:from-amber-600 hover:to-orange-600 transition flex items-center justify-center space-x-2 touch-btn flex-none">
                    <span>確認金額並全螢幕顯示給客人看</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>

            <!-- 右側：今日交易紀錄與明細 (5欄) -->
            <div class="md:col-span-5 bg-white p-5 rounded-2xl shadow-sm border border-slate-200/60 flex flex-col h-full overflow-hidden">
                <div class="flex items-center justify-between pb-3.5 border-b border-slate-100 flex-none">
                    <div>
                        <h2 class="font-bold text-slate-900 text-base md:text-lg">📋 今日交易紀錄與明細</h2>
                        <p class="text-xs md:text-sm text-slate-400">已記錄的結帳金額清單</p>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-400 font-bold">今日總累計</div>
                        <div class="text-xl md:text-2xl font-black text-amber-600">NT$ <span id="todayTotalDisplay">0</span></div>
                    </div>
                </div>

                <!-- 紀錄清單 -->
                <div id="transactionList" class="flex-1 overflow-y-auto py-3 space-y-2.5">
                    <div id="emptyTip" class="text-center py-16 text-slate-300 text-base font-medium">
                        尚無交易紀錄，請輸入金額並點擊確認
                    </div>
                </div>

                <!-- 底部快捷紀錄按鈕 -->
                <div class="pt-3 border-t border-slate-100 flex-none">
                    <button onclick="recordCurrentAmount()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-800 font-bold rounded-xl text-sm md:text-base transition touch-btn flex items-center justify-center space-x-1 shadow-sm">
                        <span>＋ 記錄目前金額至明細中（不切換全螢幕）</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- 客戶端金額全螢幕顯示畫面 (Customer Fullscreen Amount View) -->
    <div id="customerView" class="fixed inset-0 bg-white z-50 hidden flex flex-col justify-between items-center p-8 md:p-14 text-center cursor-pointer" onclick="returnToControl()">
        <!-- 頂端提示 -->
        <div class="pt-4">
            <span class="inline-block px-6 py-3 bg-amber-50 text-amber-900 font-black rounded-2xl text-xl md:text-2xl border border-amber-200 shadow-sm">
                🍈 甜蜜蜜水果 歡迎光臨
            </span>
        </div>

        <!-- 巨大金額呈現 -->
        <div class="my-auto w-full max-w-6xl px-4">
            <div class="text-3xl md:text-5xl font-bold text-slate-400 mb-4 tracking-wide">今日金額一共是</div>
            <div class="text-7xl sm:text-9xl md:text-[11rem] font-black text-amber-600 tracking-tight drop-shadow-sm flex items-center justify-center flex-wrap gap-4">
                <span>NT$</span>
                <span id="customerAmountDisplay">0</span>
                <span class="text-5xl sm:text-7xl md:text-8xl font-black text-slate-800 ml-2">元</span>
            </div>
        </div>

        <!-- 底部返回按鈕提示 -->
        <div class="pb-4">
            <div class="inline-flex items-center space-x-2 text-slate-500 text-base md:text-lg bg-slate-100 px-6 py-3 rounded-2xl border border-slate-200 shadow-sm font-bold">
                <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                <span>點擊畫面任意處即可返回修改金額</span>
            </div>
        </div>
    </div>

    <!-- 拔智齒公告全螢幕顯示畫面 (Wisdom Tooth Notice Fullscreen View) -->
    <div id="wisdomNoticeView" class="fixed inset-0 bg-sky-600 z-50 hidden flex flex-col justify-between items-center p-8 md:p-14 text-center cursor-pointer text-white" onclick="returnToControl()">
        <!-- 頂端圖示標籤 -->
        <div class="pt-6">
            <span class="inline-block px-6 py-3 bg-sky-500 text-white font-black rounded-2xl text-xl md:text-2xl border border-sky-400 shadow-md">
                🦷 甜蜜蜜水果 溫馨告示
            </span>
        </div>

        <!-- 超大醒目字體公告內容 -->
        <div class="my-auto w-full max-w-6xl px-4">
            <div class="text-5xl sm:text-7xl md:text-8xl lg:text-9xl font-black tracking-tight leading-tight drop-shadow-md">
                今日拔智齒<br>不方便說話<br>請多多見諒 🙏
            </div>
        </div>

        <!-- 底部返回按鈕提示 -->
        <div class="pb-6">
            <div class="inline-flex items-center space-x-2 text-sky-100 text-base md:text-xl bg-sky-700/80 px-7 py-3.5 rounded-2xl border border-sky-500 shadow-md font-bold">
                <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                <span>點擊畫面任意處即可返回主控台</span>
            </div>
        </div>
    </div>

    <!-- 自定義全部重設確認對話框 (Custom Modal to replace confirm()) -->
    <div id="resetModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl border border-slate-100 text-center space-y-5">
            <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black">
                ⚠️
            </div>
            <div>
                <h3 class="text-xl font-black text-slate-900 mb-2">確定要全部重設嗎？</h3>
                <p class="text-sm text-slate-500">這將會清除所有今日交易明細紀錄與目前輸入的計算金額，無法復原。</p>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="closeResetModal()" class="py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-base transition touch-btn">
                    取消
                </button>
                <button onclick="executeClearAll()" class="py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl text-base transition touch-btn shadow-md shadow-rose-200">
                    確定重設
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯控制 -->
    <script>
        let currentInput = "0";
        let expression = "";
        let transactions = [];

        function updateDisplay() {
            document.getElementById("displayAmount").innerText = Number(currentInput).toLocaleString();
            document.getElementById("subExpression").innerText = expression;
        }

        function appendNum(num) {
            if (currentInput === "0" && num !== "00") {
                currentInput = num;
            } else {
                if (currentInput.length < 9) {
                    currentInput += num;
                }
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === "" && expression === "") return;
            if (currentInput !== "") {
                expression += currentInput + " " + op + " ";
                currentInput = "";
            } else if (expression.length > 0) {
                expression = expression.trim().slice(0, -1) + " " + op + " ";
            }
            updateDisplay();
        }

        function calculateTotal() {
            if (expression === "" && currentInput === "") return;
            try {
                let fullExpr = expression + currentInput;
                let result = eval(fullExpr.replace(/[^0-9+\-*/.]/g, ''));
                if (isNaN(result) || !isFinite(result)) {
                    result = 0;
                }
                currentInput = Math.max(0, Math.round(result)).toString();
                expression = "";
                updateDisplay();
            } catch (e) {
                currentInput = "0";
                expression = "";
                updateDisplay();
            }
        }

        function clearCurrentEntry() {
            currentInput = "0";
            updateDisplay();
        }

        function openResetModal() {
            document.getElementById("resetModal").classList.remove("hidden");
        }

        function closeResetModal() {
            document.getElementById("resetModal").classList.add("hidden");
        }

        function executeClearAll() {
            currentInput = "0";
            expression = "";
            transactions = [];
            updateDisplay();
            renderTransactions();
            closeResetModal();
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function getCalculatedValue() {
            if (expression !== "") {
                calculateTotal();
            }
            return parseInt(currentInput) || 0;
        }

        function recordCurrentAmount() {
            let val = getCalculatedValue();
            if (val <= 0) return;

            let now = new Date();
            let timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                          now.getMinutes().toString().padStart(2, '0') + ':' + 
                          now.getSeconds().toString().padStart(2, '0');

            transactions.unshift({
                id: Date.now(),
                amount: val,
                time: timeStr
            });

            currentInput = "0";
            expression = "";
            updateDisplay();
            renderTransactions();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            renderTransactions();
        }

        function renderTransactions() {
            const listEl = document.getElementById("transactionList");
            const emptyTip = document.getElementById("emptyTip");
            const totalDisplay = document.getElementById("todayTotalDisplay");

            let totalSum = transactions.reduce((sum, t) => sum + t.amount, 0);
            totalDisplay.innerText = totalSum.toLocaleString();

            if (transactions.length === 0) {
                listEl.innerHTML = `<div id="emptyTip" class="text-center py-16 text-slate-300 text-base font-medium">尚無交易紀錄，請輸入金額並點擊確認</div>`;
                return;
            }

            let html = "";
            transactions.forEach((t, index) => {
                let seq = transactions.length - index;
                html += `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100 rounded-2xl border border-slate-200/60 transition">
                        <div class="flex items-center space-x-3">
                            <span class="w-8 h-8 rounded-xl bg-amber-100 text-amber-900 text-xs md:text-sm font-bold flex items-center justify-center">${seq}</span>
                            <div>
                                <div class="text-xs text-slate-400 font-semibold">${t.time}</div>
                                <div class="text-base font-black text-slate-900">NT$ ${t.amount.toLocaleString()}</div>
                            </div>
                        </div>
                        <button onclick="deleteTransaction(${t.id})" class="text-slate-400 hover:text-rose-600 p-2 rounded-xl transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        function confirmAndShow() {
            let val = getCalculatedValue();
            if (val > 0) {
                let now = new Date();
                let timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                              now.getMinutes().toString().padStart(2, '0') + ':' + 
                              now.getSeconds().toString().padStart(2, '0');

                transactions.unshift({
                    id: Date.now(),
                    amount: val,
                    time: timeStr
                });
                renderTransactions();
            }

            let totalSum = transactions.reduce((sum, t) => sum + t.amount, 0);
            document.getElementById("customerAmountDisplay").innerText = totalSum.toLocaleString();
            document.getElementById("customerView").classList.remove("hidden");

            currentInput = "0";
            expression = "";
            updateDisplay();
        }

        function showWisdomToothNotice() {
            document.getElementById("wisdomNoticeView").classList.remove("hidden");
        }

        function returnToControl() {
            document.getElementById("customerView").classList.add("hidden");
            document.getElementById("wisdomNoticeView").classList.add("hidden");
        }
    </script>
</body>
</html>
